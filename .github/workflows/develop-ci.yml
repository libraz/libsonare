name: Develop CI

# Fast feedback for day-to-day work on develop: formatting, linting, and a
# single-platform (Linux/Debug) build + test. The heavy, thorough validation
# (multi-OS native, ASan/UBSan, coverage, WASM) runs as the pre-release gate in
# ci.yml on pull requests to main and pushes to main.
on:
  push:
    branches: [develop]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          cache-dependency-glob: bindings/python/uv.lock
      - name: Install clang-format
        # The binding's lint group pins it: the apt package follows the runner
        # image, and each major release rewraps code.
        run: uv sync --locked --project bindings/python --only-group lint
      - name: Check formatting
        run: |
          uv run --no-sync --project bindings/python clang-format --version
          git ls-files -z -- '*.h' '*.hpp' '*.c' '*.cpp' '*.mm' ':!:third_party/**' |
            xargs -0 uv run --no-sync --project bindings/python clang-format --dry-run --Werror

  lint:
    # The engines floor every package promises (the WASM binding's >=22.12.0)
    # and the Active LTS the repo develops on.
    name: Lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '26']
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Node 25 and later ship no corepack, so every leg installs the same one;
      # `corepack enable` then takes yarn's version from each packageManager.
      - run: npm install -g corepack@0.36 && corepack enable
        working-directory: .
      - uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('bindings/wasm/yarn.lock', 'bindings/node/yarn.lock', 'tools/audition/web/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - run: yarn lint
      - name: Emit the WASM binding's declarations
        # The Node type-check reads them: one cross-surface test drives the same
        # input through Node, WASM and Python, so it imports the WASM entry
        # point. Declarations only -- the emscripten module's types are tracked
        # as src/sonare.js.d.ts, so tsc needs no toolchain and dist/sonare.wasm
        # is left alone.
        run: yarn build:types
      - name: Type-check the WASM binding's tests
        # Against the declarations just emitted, which is what a consumer sees.
        run: yarn test:types
      - name: Lint and type-check the Node binding
        # Neither check needs the native addon built: tsconfig.test.json
        # excludes dist/ and build/, and the tests import from ../src rather
        # than the package entry point.
        working-directory: bindings/node
        run: |
          yarn install --immutable
          yarn lint
          yarn test:types
      - name: Lint Python
        # The ruff uv.lock resolves for the binding's lint group, so a new ruff
        # release cannot fail an unrelated pull request.
        #
        # The repo rather than a path list, matching `make lint`. Python lives
        # in ten trees here and only the binding was gated, so a lint error
        # anywhere else -- `tools/`, `benchmarks/`, `tests/` -- reached develop
        # unseen. Ruff respects .gitignore and skips node_modules by default.
        working-directory: .
        run: |
          uv sync --locked --project bindings/python --only-group lint
          uv run --no-sync --project bindings/python ruff check .
      - name: Type-check the Python binding
        # main-ci type-checks the stubs, but only on main, so type errors used
        # to accumulate on develop and surface all at once at release time.
        # Source-only like the ruff step: mypy_path resolves libsonare from
        # src/, so the package itself is neither installed nor built. numpy is
        # needed even though the config skips following it -- the override only
        # applies once the module resolves, and without it every importing
        # module reports import-not-found. Both come from uv.lock, since mypy in
        # particular reports new errors on unchanged code with every release.
        #
        # The second invocation is the non-vacuity guard: a file that must not
        # type-check, so a misconfiguration that silently checks nothing fails
        # here rather than passing everything.
        working-directory: bindings/python
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync mypy --strict src/libsonare ../../tests/typing/python_smoke.py
          if uv run --no-sync mypy --strict ../../tests/typing/python_catalog_invalid.py; then
            echo "python_catalog_invalid.py unexpectedly passed mypy" >&2
            exit 1
          fi
      - name: Drift gates
        # The mechanical cross-surface gates, all read-only and stdlib-only
        # except numpy: the bank-policy gate imports the shipping
        # `tools/voicematch/status.py`, which reaches numpy through `capture.py`;
        # `conformance` also runs the listening page's vitest suite, so its
        # node_modules are installed first.
        # Invoked through the Makefile so this list cannot drift from it: a
        # hand-copied one silently omits whatever gate is added to `conformance`
        # next, and reports green while doing it.
        #
        # `abi-layout-check` is the only gate needing a compiler, and it builds a
        # small probe from the public C headers rather than the project, so this
        # job stays build-free. It is also the load-bearing one: it compares
        # every ctypes Structure against sizeof/alignof/offsetof taken from the
        # C headers, and a desync there segfaults the Python binding rather than
        # failing a test.
        #
        # `parity` depends on `conformance`, whose closing live-CLI comparison
        # skips itself when no built CLI is present, as it is here.
        #
        # The binding's environment goes first on PATH, so the gates that call
        # python3 directly get the numpy uv.lock resolves.
        working-directory: .
        run: |
          uv sync --locked --project bindings/python
          export PATH="$PWD/bindings/python/.venv/bin:$PATH"
          (cd tools/audition/web && yarn install --immutable)
          make abi-layout-check
          make check-abi-version
          make processor-types-check
          make parity

  voicematch:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          cache-dependency-glob: bindings/python/uv.lock
      - name: Run Python tool tests
        # `tools/` sits outside ctest and outside the drift gates, and this
        # workflow runs ctest directly rather than `make test`, so nothing else
        # here exercises the calibration harness or the SOFA-to-HRTF converter.
        #
        # The cases read only the tracked capture definitions and reference
        # profiles -- no rendered corpus, no plugin, no built library -- so this
        # job stays build-free. Two skip themselves when there is no shared
        # library to render with.
        run: make test-voicematch

  build-and-test:
    name: Native C++ (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/ccache-restore
        with:
          key-prefix: ccache-v1-gcc-debug-
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_CLI=OFF -DSONARE_WITH_FFMPEG=OFF -DSONARE_TEST_SHARDS=16
      - name: Build
        id: build
        # Capped at 2 jobs: unbounded parallelism OOM-kills cc1plus on the
        # 4-core/16GB hosted runners when compiling the large Debug test TUs.
        run: cmake --build build --parallel 2
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: ${{ steps.ccache.outputs.key }}
          save: ${{ github.event_name == 'push' && steps.build.outcome == 'success' }}
      - name: Generate K-weighting reference fixture
        run: make fixtures
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel 4
      # `make test-golden` is deliberately not run here. The golden hashes
      # quantize samples at 1e-6 before folding them into FNV-1a, which is
      # finer than the float reproducibility across architectures and libm
      # implementations, so a hash generated on one host cannot match another.
      # They stay a same-environment regression check, run locally.

  examples:
    name: Examples (Python and C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          cache-dependency-glob: bindings/python/uv.lock
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev
          uv sync --locked --project bindings/python --no-dev --no-install-project
          echo "$PWD/bindings/python/.venv/bin" >> "$GITHUB_PATH"
      - name: Generate a short WAV fixture
        run: |
          python - <<'PY'
          import math
          import struct
          import wave

          with wave.open('example-input.wav', 'wb') as output:
              output.setnchannels(1)
              output.setsampwidth(2)
              output.setframerate(48000)
              output.writeframes(b''.join(
                  struct.pack('<h', round(0.4 * 32767 * math.sin(2 * math.pi * 440 * i / 48000)))
                  for i in range(48000 * 3)
              ))
          PY
      - name: Build the Python shared library
        run: |
          cmake -B build-examples -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED=ON \
                -DBUILD_TESTING=OFF -DBUILD_CLI=OFF -DSONARE_WITH_FFMPEG=OFF
          cmake --build build-examples --target sonare_shared --parallel 2
          cp build-examples/lib/libsonare.so bindings/python/src/libsonare/
      - name: Check capability catalog
        # Reads the Release shared library built above, so no build tree is
        # retargeted.
        run: python3 tools/generate_capability_catalog.py --library build-examples/lib/libsonare.so --check
      - name: Run Python examples
        env:
          PYTHONPATH: bindings/python/src
        run: |
          python examples/python/analyze.py example-input.wav
          python examples/python/master.py example-input.wav example-mastered.wav
          python examples/python/midi_to_wav.py example-midi.wav
          test -s example-mastered.wav
          test -s example-midi.wav
      - name: Build and run the C++ example
        run: |
          cmake -S examples/cpp -B build-examples-cpp -DBUILD_CLI=OFF -DBUILD_TESTING=OFF \
                -DSONARE_WITH_FFMPEG=OFF
          cmake --build build-examples-cpp --parallel 2
          build-examples-cpp/analyze example-input.wav

  install-package:
    # The C++ distribution path, checked the way a consumer meets it: install
    # into a scratch prefix, then configure a project that knows nothing but
    # find_package(sonare). In-tree builds link every target together, so an
    # incomplete link interface or a missing installed header cannot show up
    # anywhere else. The macOS half of this runs on the main-branch workflow.
    name: Installed package (find_package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev pkg-config
      - name: Build and install into a scratch prefix
        run: |
          cmake -B build-install -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
                -DBUILD_SHARED=ON -DSONARE_WITH_FFMPEG=OFF \
                -DCMAKE_INSTALL_PREFIX="$PWD/install-prefix"
          cmake --build build-install --parallel 2
          cmake --install build-install
      - name: Consume it from a project that only knows find_package
        run: |
          cmake -S tests/cmake/consumer -B build-install-consumer \
                -DCMAKE_PREFIX_PATH="$PWD/install-prefix"
          cmake --build build-install-consumer --parallel 2
          ctest --test-dir build-install-consumer --output-on-failure --no-tests=error
      - name: Check the pkg-config file
        run: |
          PC_DIR="$(dirname "$(find "$PWD/install-prefix" -name sonare.pc | head -1)")"
          PKG_CONFIG_PATH="$PC_DIR" pkg-config --validate sonare
          PKG_CONFIG_PATH="$PC_DIR" pkg-config --modversion sonare
          PKG_CONFIG_PATH="$PC_DIR" pkg-config --cflags --libs sonare

  python-wheel:
    name: Python wheel (manylinux x86_64)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          cache-dependency-glob: bindings/python/uv.lock
      - name: Build, audit, and test wheel
        # The manylinux image has no system Eigen package; the top-level CMake
        # FetchContent fallback supplies its header-only dependency.
        run: |
          cmake -B build-wheel -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED=ON \
                                -DBUILD_TESTING=OFF -DBUILD_CLI=OFF \
                                -DSONARE_WITH_FFMPEG=OFF
          cmake --build build-wheel --target sonare_shared --config Release --parallel
          cp build-wheel/lib/libsonare.so bindings/python/src/libsonare/
          cd bindings/python
          export UV_PYTHON=/opt/python/cp313-cp313/bin/python
          uv build --wheel --out-dir dist-raw/
          uv run --locked --only-group wheel auditwheel repair dist-raw/*.whl -w dist/ --plat manylinux_2_28_x86_64
          uv run --locked --only-group wheel auditwheel show dist/*.whl
          # The wheel is a shipped artifact, so run its suite against the
          # repaired wheel here rather than for the first time at publish time,
          # in a venv holding the wheel and the test group from uv.lock.
          # `-m "not slow"` comes from pyproject.
          uv venv "$RUNNER_TEMP/wheel-test"
          uv export --locked --only-group test --no-emit-project --no-hashes -o "$RUNNER_TEMP/test-group.txt"
          uv pip install --python "$RUNNER_TEMP/wheel-test" dist/*.whl -r "$RUNNER_TEMP/test-group.txt"
          "$RUNNER_TEMP/wheel-test/bin/python" -c "import libsonare; libsonare.version()"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pytest tests/ -x -q

  prune-caches:
    # Keeps the newest ccache entry per configuration on this ref. It is its own
    # job so that the jobs running repository code never hold a token that can
    # delete caches.
    name: Prune caches
    if: always() && github.event_name == 'push'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete superseded ccache entries
        run: |
          gh cache list --ref "$GITHUB_REF" --key ccache-v1- --limit 100 --sort created_at --order desc --json id,key |
            jq -r 'group_by(.key | sub("-[0-9]+$"; "")) | .[] | .[1:][].id' |
            xargs -r -n1 gh cache delete
