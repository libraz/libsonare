name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          git ls-files -z -- '*.h' '*.hpp' '*.c' '*.cpp' '*.mm' ':!:third_party/**' |
            xargs -0 clang-format --dry-run --Werror

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            bindings/wasm/yarn.lock
            bindings/node/yarn.lock
      - run: yarn install --immutable
      - run: yarn lint
      - name: Lint and type-check the Node binding
        # Source-only, so neither check needs the native addon built:
        # tsconfig.test.json excludes dist/ and build/, and the tests import
        # from ../src rather than the package entry point.
        working-directory: bindings/node
        run: |
          yarn install --immutable
          yarn lint
          yarn test:types
      - name: Lint the Python binding
        # Pinned to the resolved version in requirements-dev.lock: an unpinned
        # install lets a new ruff release fail an unrelated pull request.
        # Invoked as a module so the check does not depend on pip's script
        # directory being on PATH.
        working-directory: .
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.15.14
          python3 -m ruff check bindings/python/src bindings/python/tests
      - name: Drift gates
        # The mechanical cross-surface gates. All are stdlib-only and read-only.
        # `gen_abi_layout.py --check` is the only one needing a compiler, and it
        # builds a small probe from the public C headers rather than the
        # project, so this job stays build-free. Invoked directly rather than
        # through `make ci-local`, whose layout target wraps the same script in
        # rye -- which the runner does not have and the script does not need.
        #
        # The layout check is the load-bearing one: it compares every ctypes
        # Structure against sizeof/alignof/offsetof taken from the C headers,
        # and a desync there segfaults the Python binding rather than failing a
        # test.
        working-directory: .
        run: |
          python3 tools/abi/check_abi_versions.py
          python3 tools/generate_processor_types.py --check
          python3 tools/abi/gen_abi_layout.py --check
          python3 tools/conformance/check_public_contracts.py
          python3 tools/api/check_request_object_coverage.py
          python3 tools/conformance/check_cli_contract.py --schema
          python3 -m unittest tests/conformance/test_cli_contract.py
          python3 tools/parity/check_parity.py
          python3 tools/parity/test_handle_gating.py
          python3 tools/parity/test_record_shape.py
          python3 tools/parity/test_ts_reexport.py
          python3 tools/parity/test_surface_coverage.py
          python3 tools/parity/test_allowlist_audit.py
          python3 tools/parity/surface_coverage.py --check
          python3 tools/parity/check_parity.py --audit-allowlist

  build-and-test:
    name: Native C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_CLI=OFF -DSONARE_WITH_FFMPEG=OFF
      - name: Build
        # Capped at 2 jobs: unbounded parallelism OOM-kills cc1plus on the
        # hosted runners when compiling the large Debug test TUs.
        run: cmake --build build --parallel 2
      - name: Generate K-weighting reference fixture
        run: make fixtures
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel
      # `make test-golden` is deliberately not run here. The golden hashes
      # quantize samples at 1e-6 before folding them into FNV-1a, which is
      # finer than the float reproducibility across architectures and libm
      # implementations, so a hash generated on one host cannot match another.
      # They stay a same-environment regression check, run locally.
      - name: Verify live librosa references
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --disable-pip-version-check librosa==0.11.0
          python3 tests/librosa/run_live_reference_check.py --build-dir build

  install-package:
    # The one gate that sees the library the way a C++ consumer does. Everything
    # else builds in tree, where every target links the whole set and an
    # exported target's incomplete link interface, a missing header, or a
    # source-tree path written into the export file all stay invisible.
    name: Installed package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev pkg-config
      - name: Build and install into a scratch prefix
        run: |
          cmake -B build-install -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
                -DBUILD_SHARED=ON -DSONARE_WITH_FFMPEG=OFF \
                -DCMAKE_INSTALL_PREFIX="$PWD/install-prefix"
          cmake --build build-install --parallel 2
          cmake --install build-install
      - name: Consume it from a project that only knows find_package
        run: |
          cmake -S tests/cmake/consumer -B build-install-consumer \
                -DCMAKE_PREFIX_PATH="$PWD/install-prefix"
          cmake --build build-install-consumer --parallel 2
          ctest --test-dir build-install-consumer --output-on-failure --no-tests=error
      - name: Check the pkg-config file
        run: |
          PC_DIR="$(dirname "$(find "$PWD/install-prefix" -name sonare.pc | head -1)")"
          PKG_CONFIG_PATH="$PC_DIR" pkg-config --validate sonare
          PKG_CONFIG_PATH="$PC_DIR" pkg-config --modversion sonare
          PKG_CONFIG_PATH="$PC_DIR" pkg-config --cflags --libs sonare

  sanitizer:
    name: ASan/UBSan (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang build-essential libeigen3-dev
      - name: Configure with sanitizers
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBUILD_CLI=OFF \
            -DSONARE_WITH_FFMPEG=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        # Capped at 2 jobs: sanitizer instrumentation makes the Debug test TUs
        # even heavier; unbounded parallelism OOM-kills the compiler.
        run: cmake --build build-sanitize --parallel 2
      - name: Generate K-weighting reference fixture
        run: make fixtures
      - name: Test
        # `halt_on_error=1` is what makes this a gate. UndefinedBehaviorSanitizer
        # otherwise diagnoses and continues, so the process still exits 0, Catch2
        # still reports every test passed, ctest still exits 0, and
        # --output-on-failure never prints the diagnostic because nothing failed.
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure --parallel
      # Windows is intentionally excluded: MSVC sanitizer coverage differs from
      # Clang/GCC ASan+UBSan and would make this gate inconsistent across OSes.

  coverage-wasm:
    name: Coverage + WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 5.0.2
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: bindings/wasm/yarn.lock

      - name: Cache CMake dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libeigen3-dev \
            lcov \
            ccache

      - name: Setup ccache
        run: |
          ccache --set-config=max_size=500M
          ccache --zero-stats

      - name: Configure CMake with coverage
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DENABLE_COVERAGE=ON \
            -DSONARE_WITH_FFMPEG=OFF

      - name: Build
        # Capped at 2 jobs: coverage instrumentation makes the Debug test TUs
        # even heavier; unbounded parallelism OOM-kills the compiler.
        run: cmake --build build --parallel 2

      - name: Show ccache statistics
        run: ccache --show-stats

      - name: Generate K-weighting reference fixture
        run: make fixtures

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure --parallel

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit optional fixture manifests
        run: |
          python -m py_compile \
            tests/fixtures/json_safe.py \
            tests/fixtures/audit_manifests.py \
            tests/fixtures/run_optional_fixture_report.py \
            tests/fixtures/evaluate_optional_fixture_targets.py \
            tests/fixtures/compare_optional_fixture_reports.py \
            tests/fixtures/realtime_voice_changer_parity.py \
            tests/fixtures/realtime_voice_changer_quality_gate.py
          python tests/fixtures/audit_manifests.py
      - name: Build shared library for Python fixture
        # The Python binding loads libsonare via dlopen; the static-library
        # build above can't satisfy that. Configure a second tree with
        # BUILD_SHARED=ON so we can exercise the realtime voice changer quality
        # gate without rebuilding the full coverage tree.
        run: |
          cmake -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_CLI=OFF \
            -DBUILD_SHARED=ON
          cmake --build build-shared --parallel --target sonare_shared
      - name: Check capability catalog
        # develop-ci runs this through `make capability-catalog-check`, whose
        # build-shared prerequisite would retarget build/ to Release and discard
        # the coverage tree this job depends on. The underlying script takes the
        # library path directly, so point it at the shared build above and add
        # no build.
        run: |
          python3 tools/generate_capability_catalog.py \
            --library build-shared/lib/libsonare.so --check
      - name: Type-check Python stubs
        working-directory: bindings/python
        run: |
          python -m pip install -e . mypy
          python -m mypy --strict src/libsonare ../../tests/typing/python_smoke.py
          if python -m mypy --strict ../../tests/typing/python_catalog_invalid.py; then
            echo "python_catalog_invalid.py unexpectedly passed mypy" >&2
            exit 1
          fi
      - name: Realtime voice changer quality gate
        # Exercises every built-in preset on synthetic speech-like signals and
        # asserts LUFS / peak / throughput bands. Catches DSP regressions the
        # unit tests don't (e.g. envelope follower drift, preset metadata
        # mismatches). Uses the shared library built one step earlier.
        env:
          SONARE_LIB_DIR: ${{ github.workspace }}/build-shared/lib
        working-directory: bindings/python
        run: |
          # Resolve the platform-specific shared lib file inside the dir above.
          libpath="$(ls "$SONARE_LIB_DIR"/libsonare.so "$SONARE_LIB_DIR"/libsonare.dylib 2>/dev/null | head -n 1)"
          if [ -z "$libpath" ]; then
            echo "No shared sonare library found under $SONARE_LIB_DIR" >&2
            exit 1
          fi
          SONARE_LIB_PATH="$libpath" python ../../tests/fixtures/realtime_voice_changer_quality_gate.py

      - name: Python binding tests
        # The wheel is a shipped artifact and its suite otherwise runs only in
        # publish.yml, which is after the decision to release. Reuses the shared
        # library and the editable install from the two steps above, so this
        # adds no build.
        env:
          SONARE_LIB_DIR: ${{ github.workspace }}/build-shared/lib
        working-directory: bindings/python
        run: |
          libpath="$(ls "$SONARE_LIB_DIR"/libsonare.so "$SONARE_LIB_DIR"/libsonare.dylib 2>/dev/null | head -n 1)"
          if [ -z "$libpath" ]; then
            echo "No shared sonare library found under $SONARE_LIB_DIR" >&2
            exit 1
          fi
          python -m pip install pytest
          SONARE_LIB_PATH="$libpath" python -m pytest tests/ -q

      - name: Type-check Node preset literals
        working-directory: bindings/node
        run: |
          yarn install --immutable
          yarn tsc --noEmit --ignoreConfig --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --types node ../../tests/typing/node_smoke.ts

      - name: Generate coverage report
        run: |
          mkdir -p build/coverage
          lcov --directory build --capture --output-file build/coverage/coverage.info --ignore-errors source,gcov,negative
          lcov --extract build/coverage/coverage.info "${PWD}/src/*" --output-file build/coverage/coverage_filtered.info --ignore-errors unused,negative

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage/coverage_filtered.info
          flags: unittests
          name: codecov-libsonare
          fail_ci_if_error: false

      - name: Install Node deps (WASM binding)
        working-directory: bindings/wasm
        run: yarn install --immutable
      - name: Build WASM binding
        working-directory: bindings/wasm
        run: yarn build
      - name: Test WASM binding
        working-directory: bindings/wasm
        run: yarn test && yarn test:types
      # Reads the built compile_commands.json, so it has to follow the build. A
      # catch compiled without -fexceptions is deleted silently: no compile
      # error, no link error, no failing test, just a throw that walks past its
      # handler. Both configurations run because a feature-off build compiles a
      # different set of units.
      - name: Check WASM exception scope
        run: |
          python3 tests/conformance/check_wasm_exception_scope.py
          python3 tests/conformance/check_wasm_exception_scope.py \
            --build-dir bindings/wasm/build-wasm-analysis
      # `yarn check:wasm-size` is deliberately not run as a gate. Its budget is
      # measured against a baseline that only moves when it is rebased by hand,
      # so any release that adds features trips it while saying nothing about
      # correctness. The reporting step below keeps the numbers visible, and the
      # budget check stays available locally.
      - name: Report WASM size
        run: |
          mkdir -p build/reports
          baseline_args=()
          if [ -n "${WASM_BASELINE:-}" ]; then
            baseline_args=(--wasm-baseline "$WASM_BASELINE")
          fi
          python tests/fixtures/run_optional_fixture_report.py \
            --suite music \
            --sonare-tests build/bin/sonare_tests \
            --include-wasm-size \
            --wasm-current bindings/wasm/dist/sonare.wasm \
            "${baseline_args[@]}" \
            --output build/reports/wasm-size-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/reports/wasm-size-report.json").read_text())
          observations = [
              item
              for run in report["runs"]
              for item in run.get("observations", [])
              if item.get("metric") == "wasm_size"
          ]
          if len(observations) != 1:
              raise SystemExit("expected exactly one wasm_size observation")
          print(json.dumps(observations[0], sort_keys=True))
          PY
          if [ -n "${WASM_BASELINE:-}" ]; then
            python tests/fixtures/evaluate_optional_fixture_targets.py \
              build/reports/wasm-size-report.json \
              --metrics wasm_size \
              --require-metrics \
              --output build/reports/wasm-size-evaluation.json
          fi
      - name: Upload WASM size report
        uses: actions/upload-artifact@v7
        with:
          name: wasm-size-report
          path: build/reports/wasm-size-*.json

  ffmpeg-decode:
    name: FFmpeg decode (ubuntu-latest)
    # Every other job pins SONARE_WITH_FFMPEG=OFF, matching the shipped
    # artifacts, so nothing else in CI compiles core/audio_io_ffmpeg.cpp. Linux
    # alone is enough: that file branches on the compiler (__clang__ vs
    # __GNUC__, around the FFmpeg header pragmas) and never on the platform, and
    # the GCC arm is the one no local build exercises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        # The four -dev packages are the set src/CMakeLists.txt probes through
        # pkg-config. The ffmpeg CLI is not optional here: six audio_io cases
        # synthesize their m4a/flac/aac fixtures at runtime and SKIP without it,
        # which would leave this job green while exercising nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            ffmpeg
      - name: Verify the ffmpeg CLI is present
        run: ffmpeg -version
      - name: Configure
        # ON, not AUTO: AUTO degrades to the WAV/MP3-only path when the dev
        # libraries are missing, so a broken install would make this job pass
        # without compiling core/audio_io_ffmpeg.cpp at all. ON fails at
        # configure instead.
        run: cmake -B build-ffmpeg -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_CLI=OFF -DSONARE_WITH_FFMPEG=ON
      - name: Build
        # Capped at 2 jobs for the same reason as the other native jobs:
        # unbounded parallelism OOM-kills cc1plus on the hosted runners.
        run: cmake --build build-ffmpeg --parallel 2
      - name: Generate K-weighting reference fixture
        # The fixture is untracked, so a fresh checkout has to generate it or
        # the K-weighting cases fail on a missing file.
        run: make fixtures
      - name: Test
        # The whole suite, not the [ffmpeg] tag. Linking FFmpeg changes which
        # decoder handles a given file, so the regressions worth catching are
        # the ones in tests that never mention FFmpeg.
        run: ctest --test-dir build-ffmpeg --output-on-failure --parallel
