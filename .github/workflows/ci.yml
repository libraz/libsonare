name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          cache-dependency-glob: bindings/python/uv.lock
      - name: Install clang-format
        # The binding's lint group pins it: the apt package follows the runner
        # image, and each major release rewraps code.
        run: uv sync --locked --project bindings/python --only-group lint
      - name: Check formatting
        run: |
          uv run --no-sync --project bindings/python clang-format --version
          git ls-files -z -- '*.h' '*.hpp' '*.c' '*.cpp' '*.mm' ':!:third_party/**' |
            xargs -0 uv run --no-sync --project bindings/python clang-format --dry-run --Werror

  lint:
    # The engines floor every package promises (the WASM binding's >=22.12.0)
    # and the Active LTS the repo develops on.
    name: Lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '26']
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Node 25 and later ship no corepack, so every leg installs the same one;
      # `corepack enable` then takes yarn's version from each packageManager.
      - run: npm install -g corepack@0.36 && corepack enable
        working-directory: .
      - uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('bindings/wasm/yarn.lock', 'bindings/node/yarn.lock', 'tools/audition/web/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --immutable
      - run: yarn lint
      - name: Emit the WASM binding's declarations
        # The Node type-check reads them: one cross-surface test drives the same
        # input through Node, WASM and Python, so it imports the WASM entry
        # point. Declarations only -- the emscripten module's types are tracked
        # as src/sonare.js.d.ts, so tsc needs no toolchain and dist/sonare.wasm
        # is left alone.
        run: yarn build:types
      - name: Lint and type-check the Node binding
        # Several tests resolve the Node package's emitted declarations.
        # The TypeScript build emits them without building the native addon.
        working-directory: bindings/node
        run: |
          yarn install --immutable
          yarn lint
          yarn build:ts
          yarn test:types
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          cache-dependency-glob: bindings/python/uv.lock
      - name: Lint Python
        # The ruff uv.lock resolves for the binding's lint group, so a new ruff
        # release cannot fail an unrelated pull request.
        #
        # The repo rather than a path list, matching `make lint`. Python lives
        # in ten trees here and only the binding was gated, so a lint error
        # anywhere else -- `tools/`, `benchmarks/`, `tests/` -- reached main
        # unseen. Ruff respects .gitignore and skips node_modules by default.
        working-directory: .
        run: |
          uv sync --locked --project bindings/python --only-group lint
          uv run --no-sync --project bindings/python ruff check .
      # The binding checks above exercise the package's Node floor. The
      # repository's audition suite uses jsdom, which needs a newer Node.
      - uses: actions/setup-node@v7
        if: matrix.node == '22.12.0'
        with:
          node-version: '26'
      - name: Drift gates
        # The mechanical cross-surface gates, all read-only and stdlib-only
        # except numpy: the bank-policy gate imports the shipping
        # `tools/voicematch/status.py`, which reaches numpy through `capture.py`;
        # `conformance` also runs the listening page's vitest suite, so its
        # node_modules are installed first.
        # Invoked through the Makefile so this list cannot drift from it: a
        # hand-copied one silently omits whatever gate is added to `conformance`
        # next, and reports green while doing it.
        #
        # `abi-layout-check` is the only gate needing a compiler, and it builds a
        # small probe from the public C headers rather than the project, so this
        # job stays build-free. It is also the load-bearing one: it compares
        # every ctypes Structure against sizeof/alignof/offsetof taken from the
        # C headers, and a desync there segfaults the Python binding rather than
        # failing a test.
        #
        # `parity` depends on `conformance`, whose comparisons against a built CLI,
        # shared library or binding tree fail when that build is absent; this job
        # builds nothing, so it runs them report-only.
        #
        # `surface-check` reads the Node and WASM facades through each package's
        # own TypeScript, so both packages' node_modules are installed; nothing
        # is built.
        #
        # The binding's environment goes first on PATH, so the gates that call
        # python3 directly get the numpy uv.lock resolves.
        working-directory: .
        run: |
          uv sync --locked --project bindings/python
          export PATH="$PWD/bindings/python/.venv/bin:$PATH"
          (cd tools/audition/web && yarn install --immutable)
          (cd tools/audition/web && yarn lint && yarn typecheck)
          (cd bindings/node && yarn install --immutable)
          (cd bindings/wasm && yarn install --immutable)
          make lint-static
          make abi-layout-check
          make check-abi-version
          make processor-types-check
          make parity SONARE_CONFORMANCE_REPORT_ONLY=1
          make surface-check

  voicematch:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          cache-dependency-glob: bindings/python/uv.lock
      - name: Run Python tool tests
        # `tools/` sits outside ctest and outside the drift gates, and this
        # workflow runs ctest directly rather than `make test`, so nothing else
        # here exercises the calibration harness or the SOFA-to-HRTF converter.
        #
        # The cases read only the tracked capture definitions and reference
        # profiles -- no rendered corpus, no plugin, no built library -- so this
        # job stays build-free. Two skip themselves when there is no shared
        # library to render with.
        run: make test-voicematch

  build-and-test:
    name: Native C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/ccache-restore
        with:
          key-prefix: ccache-v1-${{ matrix.os == 'macos-latest' && 'appleclang' || 'gcc' }}-debug-
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_CLI=OFF -DSONARE_WITH_FFMPEG=OFF -DSONARE_TEST_SHARDS=16
      - name: Build
        id: build
        # Capped at 2 jobs: unbounded parallelism OOM-kills cc1plus on the
        # hosted runners when compiling the large Debug test TUs.
        run: cmake --build build --parallel 2
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: ${{ steps.ccache.outputs.key }}
          save: ${{ github.event_name == 'push' && steps.build.outcome == 'success' }}
      - name: Generate K-weighting reference fixture
        run: make fixtures
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel ${{ runner.os == 'macOS' && 3 || 4 }}
      # `make test-golden` is deliberately not run here. The golden hashes
      # quantize samples at 1e-6 before folding them into FNV-1a, which is
      # finer than the float reproducibility across architectures and libm
      # implementations, so a hash generated on one host cannot match another.
      # They stay a same-environment regression check, run locally.
      - uses: astral-sh/setup-uv@v10.4.0
        if: runner.os == 'Linux'
        with:
          version: "0.13.9"
          cache-dependency-glob: tests/librosa/uv.lock
      - name: Verify live librosa references
        if: runner.os == 'Linux'
        run: |
          uv sync --locked --project tests/librosa
          uv run --locked --project tests/librosa python tests/librosa/run_live_reference_check.py --build-dir build


  install-package:
    # The one gate that sees the library the way a C++ consumer does. Everything
    # else builds in tree, where every target links the whole set and an
    # exported target's incomplete link interface, a missing header, or a
    # source-tree path written into the export file all stay invisible.
    name: Installed package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev pkg-config
      - name: Build and install into a scratch prefix
        run: |
          cmake -B build-install -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
                -DBUILD_SHARED=ON -DSONARE_WITH_FFMPEG=OFF \
                -DCMAKE_INSTALL_PREFIX="$PWD/install-prefix"
          cmake --build build-install --parallel 2
          cmake --install build-install
      - name: Consume it from a project that only knows find_package
        run: |
          cmake -S tests/cmake/consumer -B build-install-consumer \
                -DCMAKE_PREFIX_PATH="$PWD/install-prefix"
          cmake --build build-install-consumer --parallel 2
          ctest --test-dir build-install-consumer --output-on-failure --no-tests=error
      - name: Check the pkg-config file
        run: |
          PC_DIR="$(dirname "$(find "$PWD/install-prefix" -name sonare.pc | head -1)")"
          PKG_CONFIG_PATH="$PC_DIR" pkg-config --validate sonare
          PKG_CONFIG_PATH="$PC_DIR" pkg-config --modversion sonare
          PKG_CONFIG_PATH="$PC_DIR" pkg-config --cflags --libs sonare

  sanitizer:
    # The instrumented suite runs about four times as long as the build, so it
    # is split in four by test number; each shard builds the same tree.
    name: ASan/UBSan (ubuntu-latest, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang build-essential libeigen3-dev
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/ccache-restore
        with:
          key-prefix: ccache-v1-clang-debug-asan-ubsan-
          max-size: 900M
          compiler: clang++
      - name: Configure with sanitizers
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBUILD_CLI=OFF \
            -DSONARE_WITH_FFMPEG=OFF \
            -DSONARE_TEST_SHARDS=128 \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        id: build
        # Capped at 2 jobs: sanitizer instrumentation makes the Debug test TUs
        # even heavier; unbounded parallelism OOM-kills the compiler.
        run: cmake --build build-sanitize --parallel 2
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: ${{ steps.ccache.outputs.key }}
          save: ${{ github.event_name == 'push' && steps.build.outcome == 'success' && matrix.shard == 1 }}
      - name: Generate K-weighting reference fixture
        run: make fixtures
      - name: Test
        # `halt_on_error=1` is what makes this a gate. UndefinedBehaviorSanitizer
        # otherwise diagnoses and continues, so the process still exits 0, Catch2
        # still reports every test passed, ctest still exits 0, and
        # --output-on-failure never prints the diagnostic because nothing failed.
        # The 128 Catch2 shards are dealt out by test number, so each job runs 32.
        # Small shards keep the slowest one near half the 1500 s ctest timeout;
        # a single case of several minutes belongs in [.][slow], not here.
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure --no-tests=error --parallel 4 -I ${{ matrix.shard }},,4
      # Windows is intentionally excluded: MSVC sanitizer coverage differs from
      # Clang/GCC ASan+UBSan and would make this gate inconsistent across OSes.

  slow-tests:
    # The [.][slow] tier, which every other job leaves out. Same sharding as the
    # sanitizer job, in an optimized build: the longest case alone is about
    # 18 minutes on a fast host, so the floor of a runner is that one case.
    name: Slow tests (ubuntu-latest, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/ccache-restore
        with:
          key-prefix: ccache-v1-gcc-release-slow-
          max-size: 900M
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DSONARE_WITH_FFMPEG=OFF \
            -DSONARE_TEST_SHARDS=128 \
            "-DSONARE_TEST_SHARD_SPEC=[slow]"
      - name: Build
        id: build
        # Capped at 2 jobs like the other builds; the CLI is built too, for its slow cases.
        run: cmake --build build --parallel 2 --target sonare_tests
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: ${{ steps.ccache.outputs.key }}
          save: ${{ github.event_name == 'push' && steps.build.outcome == 'success' && matrix.shard == 1 }}
      - name: Generate K-weighting reference fixture
        run: make fixtures
      - name: Test
        # Each job runs 32 of the 128 shards. A shard holding the longest case
        # outlives ctest's default 1500 s bound on a slow runner, hence 3600 s.
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel 4 --timeout 3600 -I ${{ matrix.shard }},,4

  release-fma:
    # The default tier as the shipped optimized builds compile it, with multiply-adds fused.
    # The Debug job never fuses, so a test asserting bit-identity between two compiled copies
    # of the same arithmetic shows only here.
    name: Native C++ (GCC Release, x86-64-v3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/ccache-restore
        with:
          key-prefix: ccache-v1-gcc-release-v3-
          max-size: 900M
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_CLI=OFF \
            -DSONARE_WITH_FFMPEG=OFF \
            -DSONARE_TEST_SHARDS=16 \
            -DCMAKE_C_FLAGS=-march=x86-64-v3 \
            -DCMAKE_CXX_FLAGS=-march=x86-64-v3
      - name: Build
        id: build
        run: cmake --build build --parallel 2
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: ${{ steps.ccache.outputs.key }}
          save: ${{ github.event_name == 'push' && steps.build.outcome == 'success' }}
      - name: Generate K-weighting reference fixture
        run: make fixtures
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel 4

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache CMake dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libeigen3-dev \
            lcov
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/ccache-restore
        with:
          key-prefix: ccache-v1-gcc-debug-coverage-
          max-size: 900M

      - name: Configure CMake with coverage
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DENABLE_COVERAGE=ON \
            -DSONARE_WITH_FFMPEG=OFF \
            -DSONARE_TEST_SHARDS=16

      - name: Build
        id: build
        # Capped at 2 jobs: coverage instrumentation makes the Debug test TUs
        # even heavier; unbounded parallelism OOM-kills the compiler.
        run: cmake --build build --parallel 2

      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: ${{ steps.ccache.outputs.key }}
          save: ${{ github.event_name == 'push' && steps.build.outcome == 'success' }}

      - name: Generate K-weighting reference fixture
        run: make fixtures

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel 4

      - name: Generate coverage report
        run: |
          mkdir -p build/coverage
          # Only src/ is uploaded, so the capture reads nothing else: GCC 15 records Catch2 template test registrations with an end line before their start.
          lcov --directory build --capture --include "${PWD}/src/*" --output-file build/coverage/coverage.info --ignore-errors source,gcov,negative,mismatch
          # GCC 15 reports a lambda opening on an executed line as an unhit function on a hit line, which lcov refuses as inconsistent.
          lcov --extract build/coverage/coverage.info "${PWD}/src/*" --output-file build/coverage/coverage_filtered.info --ignore-errors unused,negative,inconsistent

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage/coverage_filtered.info
          flags: unittests
          name: codecov-libsonare
          fail_ci_if_error: false

  python-binding:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The engines floor only: it is the version the WASM package promises to run on.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      # Node 25 and later ship no corepack, so it is installed as in the lint job;
      # `corepack enable` then takes yarn's version from each packageManager.
      - run: npm install -g corepack@0.36 && corepack enable
      - uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('bindings/wasm/yarn.lock', 'bindings/node/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          cache-dependency-glob: bindings/python/uv.lock
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/ccache-restore
        with:
          key-prefix: ccache-v1-gcc-release-shared-
          max-size: 300M
      - name: Audit optional fixture manifests
        run: |
          python -m py_compile \
            tests/fixtures/json_safe.py \
            tests/fixtures/audit_manifests.py \
            tests/fixtures/run_optional_fixture_report.py \
            tests/fixtures/evaluate_optional_fixture_targets.py \
            tests/fixtures/compare_optional_fixture_reports.py \
            tests/fixtures/realtime_voice_changer_parity.py \
            tests/fixtures/realtime_voice_changer_quality_gate.py
          python tests/fixtures/audit_manifests.py
      - name: Build shared library for Python fixture
        id: build
        # The Python binding loads libsonare via dlopen, so it needs a
        # BUILD_SHARED=ON tree; the realtime voice changer quality gate and the
        # binding tests run against it. Capped at 2 jobs like the other builds:
        # a bare --parallel is an unbounded make -j on a cold cache.
        run: |
          cmake -B build-shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_CLI=OFF \
            -DBUILD_SHARED=ON
          cmake --build build-shared --parallel 2 --target sonare_shared
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: ${{ steps.ccache.outputs.key }}
          save: ${{ github.event_name == 'push' && steps.build.outcome == 'success' }}
      - name: Check capability catalog
        # The underlying script takes the library path directly, so point it at
        # the shared build above and add no build.
        run: |
          python3 tools/generate_capability_catalog.py \
            --library build-shared/lib/libsonare.so --check
      - name: Type-check Python stubs
        working-directory: bindings/python
        run: |
          uv sync --locked
          uv run --locked mypy --strict src/libsonare ../../tests/typing/python_smoke.py
          if uv run --locked mypy --strict ../../tests/typing/python_catalog_invalid.py; then
            echo "python_catalog_invalid.py unexpectedly passed mypy" >&2
            exit 1
          fi
      - name: Realtime voice changer quality gate
        # Exercises every built-in preset on synthetic speech-like signals and
        # asserts LUFS / peak / throughput bands. Catches DSP regressions the
        # unit tests don't (e.g. envelope follower drift, preset metadata
        # mismatches). Uses the shared library built above.
        env:
          SONARE_LIB_DIR: ${{ github.workspace }}/build-shared/lib
        working-directory: bindings/python
        run: |
          # Resolve the platform-specific shared lib file inside the dir above.
          libpath="$(ls "$SONARE_LIB_DIR"/libsonare.so "$SONARE_LIB_DIR"/libsonare.dylib 2>/dev/null | head -n 1)"
          if [ -z "$libpath" ]; then
            echo "No shared sonare library found under $SONARE_LIB_DIR" >&2
            exit 1
          fi
          SONARE_LIB_PATH="$libpath" uv run --locked python ../../tests/fixtures/realtime_voice_changer_quality_gate.py

      - name: Python binding tests
        # The wheel is a shipped artifact and its suite otherwise runs only in
        # publish.yml, which is after the decision to release. Reuses the shared
        # library and the environment from the steps above, so this adds no
        # build.
        # Runs the same target as `make test-python`, refusal-subject checks included.
        env:
          SONARE_LIB_DIR: ${{ github.workspace }}/build-shared/lib
        run: |
          libpath="$(ls "$SONARE_LIB_DIR"/libsonare.so "$SONARE_LIB_DIR"/libsonare.dylib 2>/dev/null | head -n 1)"
          if [ -z "$libpath" ]; then
            echo "No shared sonare library found under $SONARE_LIB_DIR" >&2
            exit 1
          fi
          SONARE_LIB_PATH="$libpath" make test-python-suite

      - name: Python binding tests at the numpy floor
        # The numpy minimum in pyproject.toml is only a claim until the suite
        # runs on it. A venv keeps the floor install apart from the binding's
        # environment. lowest-direct installs each runtime dependency at the
        # lower bound pyproject.toml declares, so the floor is read from there
        # and not restated here; pytest comes from the test group in uv.lock.
        env:
          SONARE_LIB_DIR: ${{ github.workspace }}/build-shared/lib
        working-directory: bindings/python
        run: |
          libpath="$(ls "$SONARE_LIB_DIR"/libsonare.so "$SONARE_LIB_DIR"/libsonare.dylib 2>/dev/null | head -n 1)"
          if [ -z "$libpath" ]; then
            echo "No shared sonare library found under $SONARE_LIB_DIR" >&2
            exit 1
          fi
          uv venv "$RUNNER_TEMP/numpy-floor"
          uv export --locked --only-group test --no-emit-project --no-hashes -o "$RUNNER_TEMP/test-group.txt"
          uv pip install --python "$RUNNER_TEMP/numpy-floor" --resolution lowest-direct \
            -e . -r "$RUNNER_TEMP/test-group.txt"
          SONARE_LIB_PATH="$libpath" "$RUNNER_TEMP/numpy-floor/bin/python" -m pytest tests/ -q

      - name: Type-check Node preset literals
        working-directory: bindings/node
        run: |
          yarn install --immutable
          yarn tsc --noEmit --ignoreConfig --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --types node ../../tests/typing/node_smoke.ts

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pinned release is tracked in one file; build:wasm and prepack refuse any other emcc.
      - id: emsdk-version
        run: echo "version=$(cat bindings/wasm/.emscripten-version)" >> "$GITHUB_OUTPUT"
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk-version.outputs.version }}
      # The engines floor only: it is the version the WASM package promises to run on.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      # Node 25 and later ship no corepack, so it is installed as in the lint job;
      # `corepack enable` then takes yarn's version from each packageManager.
      - run: npm install -g corepack@0.36 && corepack enable
      - uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('bindings/wasm/yarn.lock', 'bindings/node/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev
      # setup-emsdk reinstalls the em++ launcher every run, so ccache's default
      # mtime compiler check would never hit; the pinned release identifies it.
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/ccache-restore
        with:
          key-prefix: ccache-v1-emcc-release-
          max-size: 400M
          toolchain-id: ${{ steps.emsdk-version.outputs.version }}
          compiler-check: string:${{ steps.emsdk-version.outputs.version }}
          compiler-type: clang
      - name: Restore Emscripten system library cache
        id: emcache
        uses: actions/cache/restore@v6
        with:
          path: |
            bindings/wasm/build-wasm/em-cache
            bindings/wasm/build-wasm-analysis/em-cache
          key: emcache-v1-${{ steps.emsdk-version.outputs.version }}-${{ hashFiles('bindings/wasm/package.json') }}
      - name: Install Node deps (WASM binding)
        working-directory: bindings/wasm
        run: yarn install --immutable
      - name: Build WASM binding
        id: build
        working-directory: bindings/wasm
        # The build script leaves cmake's parallelism to this variable, and
        # unset it compiles one unit at a time.
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: yarn build
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: ${{ steps.ccache.outputs.key }}
          save: ${{ github.event_name == 'push' && steps.build.outcome == 'success' }}
      - name: Save Emscripten system library cache
        if: always() && github.event_name == 'push' && steps.build.outcome == 'success' && steps.emcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            bindings/wasm/build-wasm/em-cache
            bindings/wasm/build-wasm-analysis/em-cache
          key: emcache-v1-${{ steps.emsdk-version.outputs.version }}-${{ hashFiles('bindings/wasm/package.json') }}
      - name: Test WASM binding
        working-directory: bindings/wasm
        run: yarn test && yarn test:types && yarn test:bundle
      - name: Browser smokes (WASM)
        working-directory: bindings/wasm
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: yarn test:browser:all
      # Re-runs the suite with every public export wrapped and fails when more of
      # the refusals it provokes name a field in C spelling than the ratchet allows.
      - name: Refusal spelling ratchet (WASM)
        run: make refusal-spelling-check REFUSAL_SPELLING_SURFACES=wasm
      # A feature flag is read as a promise about the shipped binary, and until
      # this ran nothing held it to one: the analysis module links three units
      # from subsystems it turned off, each deliberate and each now named. Both
      # build directories, because a residue only appears in the configuration
      # whose gate is off.
      - name: Check WASM feature gate scope
        run: |
          python3 tests/conformance/check_wasm_feature_gate_scope.py \
            --build-dir bindings/wasm/build-wasm \
            --build-dir bindings/wasm/build-wasm-analysis
      # `yarn check:wasm-size` is deliberately not run as a gate. Its budget is
      # measured against a baseline that only moves when it is rebased by hand,
      # so any release that adds features trips it while saying nothing about
      # correctness. The reporting step below keeps the numbers visible, and the
      # budget check stays available locally.
      - name: Report WASM size
        run: |
          mkdir -p build/reports
          baseline_args=()
          if [ -n "${WASM_BASELINE:-}" ]; then
            baseline_args=(--wasm-baseline "$WASM_BASELINE")
          fi
          python tests/fixtures/run_optional_fixture_report.py \
            --suite music \
            --sonare-tests build/bin/sonare_tests \
            --include-wasm-size \
            --wasm-current bindings/wasm/dist/sonare.wasm \
            "${baseline_args[@]}" \
            --output build/reports/wasm-size-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/reports/wasm-size-report.json").read_text())
          observations = [
              item
              for run in report["runs"]
              for item in run.get("observations", [])
              if item.get("metric") == "wasm_size"
          ]
          if len(observations) != 1:
              raise SystemExit("expected exactly one wasm_size observation")
          print(json.dumps(observations[0], sort_keys=True))
          PY
          if [ -n "${WASM_BASELINE:-}" ]; then
            python tests/fixtures/evaluate_optional_fixture_targets.py \
              build/reports/wasm-size-report.json \
              --metrics wasm_size \
              --require-metrics \
              --output build/reports/wasm-size-evaluation.json
          fi
      - name: Upload WASM size report
        uses: actions/upload-artifact@v7
        with:
          name: wasm-size-report
          path: build/reports/wasm-size-*.json

  ffmpeg-decode:
    name: FFmpeg decode (ubuntu-latest)
    # Every other job pins SONARE_WITH_FFMPEG=OFF, matching the shipped
    # artifacts, so nothing else in CI compiles core/audio_io_ffmpeg.cpp. Linux
    # alone is enough: that file branches on the compiler (__clang__ vs
    # __GNUC__, around the FFmpeg header pragmas) and never on the platform, and
    # the GCC arm is the one no local build exercises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        # The four -dev packages are the set src/CMakeLists.txt probes through
        # pkg-config. The ffmpeg CLI is not optional here: six audio_io cases
        # synthesize their m4a/flac/aac fixtures at runtime and SKIP without it,
        # which would leave this job green while exercising nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            ffmpeg
      - name: Verify the ffmpeg CLI is present
        run: ffmpeg -version
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/ccache-restore
        with:
          key-prefix: ccache-v1-gcc-debug-ffmpeg-
      - name: Configure
        # ON, not AUTO: AUTO degrades to the WAV/MP3-only path when the dev
        # libraries are missing, so a broken install would make this job pass
        # without compiling core/audio_io_ffmpeg.cpp at all. ON fails at
        # configure instead.
        run: cmake -B build-ffmpeg -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_CLI=OFF -DSONARE_WITH_FFMPEG=ON -DSONARE_TEST_SHARDS=16
      - name: Build
        id: build
        # Capped at 2 jobs for the same reason as the other native jobs:
        # unbounded parallelism OOM-kills cc1plus on the hosted runners.
        run: cmake --build build-ffmpeg --parallel 2
      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          key: ${{ steps.ccache.outputs.key }}
          save: ${{ github.event_name == 'push' && steps.build.outcome == 'success' }}
      - name: Generate K-weighting reference fixture
        # The fixture is untracked, so a fresh checkout has to generate it or
        # the K-weighting cases fail on a missing file.
        run: make fixtures
      - name: Test
        # The whole suite, not the [ffmpeg] tag. Linking FFmpeg changes which
        # decoder handles a given file, so the regressions worth catching are
        # the ones in tests that never mention FFmpeg.
        run: ctest --test-dir build-ffmpeg --output-on-failure --no-tests=error --parallel 4

  prune-caches:
    # Keeps the newest ccache entry per configuration on this ref. It is its own
    # job so that the jobs running repository code never hold a token that can
    # delete caches.
    name: Prune caches
    if: always() && github.event_name == 'push'
    needs: [build-and-test, sanitizer, slow-tests, coverage, python-binding, wasm, ffmpeg-decode]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete superseded ccache entries
        run: |
          gh cache list --ref "$GITHUB_REF" --key ccache-v1- --limit 100 --sort created_at --order desc --json id,key |
            jq -r 'group_by(.key | sub("-[0-9]+$"; "")) | .[] | .[1:][].id' |
            xargs -r -n1 gh cache delete
