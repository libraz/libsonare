name: Publish and Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 5.0.2

      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          registry-url: 'https://registry.npmjs.org'

      # Pinned to a major so a freshly cut npm release cannot break a publish
      # that is already past the point of no return. npm 12 requires
      # ^22.22.2 || ^24.15.0 || >=26.0.0, so it is paired with the node-version
      # above; raise both together.
      - run: npm install -g npm@12
      - run: corepack enable
      - run: corepack prepare yarn@4.15.0 --activate

      - uses: actions/cache@v6
        with:
          path: |
            bindings/wasm/.yarn/cache
            bindings/wasm/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('bindings/wasm/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      - name: Build and test C++
        # Capped at 2 jobs: unbounded parallelism OOM-kills cc1plus on the
        # hosted runners when compiling the large Debug test TUs.
        # SONARE_WITH_FFMPEG is pinned rather than left to AUTO: auto-detection
        # would make a publish gate's decoder depend on what the runner image
        # happens to ship. OFF matches every other job and the released
        # artifacts. BUILD_CLI is deliberately left at its ON default, since
        # that is what registers the CLI test cases.
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSONARE_WITH_FFMPEG=OFF
          cmake --build build --parallel 2
          make fixtures
          ctest --test-dir build --output-on-failure --parallel

      - name: Install Node deps (WASM binding)
        working-directory: bindings/wasm
        run: yarn install --immutable
      - name: Build WASM binding
        working-directory: bindings/wasm
        run: yarn build
      - name: Lint WASM binding
        working-directory: bindings/wasm
        run: yarn lint
      - name: Test WASM binding
        working-directory: bindings/wasm
        run: yarn test && yarn test:types

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        working-directory: bindings/wasm
        run: npm publish --access public --provenance

  release-cli:
    needs: publish-npm
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - runner: macos-latest
            os: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Eigen3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      - name: Install Eigen3 (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen

      - name: Build native CLI
        run: |
          cmake -B build-cli -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
                             -DBUILD_SHARED=ON -DSONARE_WITH_FFMPEG=OFF
          cmake --build build-cli --target sonare sonare_shared --config Release --parallel

      - name: Generate capability catalog release asset
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: |
          python3 tools/generate_capability_catalog.py \
            --library build-cli/lib/libsonare.so \
            --output release-assets/capability-catalog.json

      - name: Package native CLI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="sonare-cli-${version}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "release-assets/${asset}"
          cp build-cli/bin/sonare-cli "release-assets/${asset}/"
          cp tools/cli/release-README.txt "release-assets/${asset}/README.txt"
          tar -czf "release-assets/${asset}.tar.gz" -C release-assets "${asset}"
          (
            cd release-assets
            if command -v sha256sum >/dev/null; then
              sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
            else
              shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
            fi
          )

      - name: Attach native CLI assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach capability catalog
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/capability-catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
            lib_name: libsonare.so
          - os: ubuntu-24.04-arm
            arch: aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
            lib_name: libsonare.so
          - os: macos-latest
            arch: arm64
            container: null
            lib_name: libsonare.dylib
          # macOS x86_64 omitted: GitHub no longer provides Intel macOS runners
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Eigen3 (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen

      - uses: actions/setup-python@v7
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'

      - name: Build shared library (Linux)
        if: runner.os == 'Linux'
        # Pin SONARE_WITH_FFMPEG=OFF for deterministic wheels: PyPI artifacts
        # must not depend on libavformat being present on the user's machine.
        # m4a/AAC users can rebuild from source with SONARE_FFMPEG=1.
        # Eigen resolves through CMake's header-only FetchContent fallback in
        # the manylinux image, which deliberately has no system Eigen package.
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED=ON \
                         -DBUILD_TESTING=OFF -DBUILD_CLI=OFF \
                         -DSONARE_WITH_FFMPEG=OFF
          cmake --build build --target sonare_shared --config Release -j

      - name: Build shared library (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED=ON \
                         -DBUILD_TESTING=OFF -DBUILD_CLI=OFF \
                         -DSONARE_WITH_FFMPEG=OFF
          cmake --build build --target sonare_shared --config Release -j

      - name: Copy shared library
        run: cp build/lib/${{ matrix.lib_name }} bindings/python/src/libsonare/

      - name: Fix dylib install name (macOS)
        if: runner.os == 'macOS'
        run: install_name_tool -id @loader_path/libsonare.dylib bindings/python/src/libsonare/libsonare.dylib

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          cd bindings/python
          /opt/python/cp313-cp313/bin/python -m pip install wheel hatchling auditwheel
          /opt/python/cp313-cp313/bin/python -m pip wheel . --no-deps -w dist-raw/
          auditwheel repair dist-raw/*.whl -w dist/ --plat manylinux_2_28_${{ matrix.arch }}
          auditwheel show dist/*.whl

      - name: Build wheel (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cd bindings/python
          python -m pip install wheel hatchling
          python -m pip wheel . --no-deps -w dist/
          python -m wheel tags --platform-tag macosx_11_0_arm64 --remove dist/*.whl

      - name: Test wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          /opt/python/cp313-cp313/bin/python -m pip install bindings/python/dist/*.whl pytest
          /opt/python/cp313-cp313/bin/python -c "import libsonare; print(f'Version: {libsonare.version()}')"
          cd bindings/python && /opt/python/cp313-cp313/bin/python -m pytest tests/ -x -q

      - name: Test wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install bindings/python/dist/*.whl pytest
          python -c "import libsonare; print(f'Version: {libsonare.version()}')"
          cd bindings/python && python -m pytest tests/ -x -q

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: bindings/python/dist/*.whl

  wheel-compat-check:
    needs: [python-wheels]
    runs-on: ubuntu-latest
    container: python:3.11-slim-bullseye
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-latest-x86_64
          path: dist/
      - name: Import the wheel on glibc 2.31
        run: |
          pip install dist/*.whl
          python -c "import libsonare; libsonare.version()"

  publish-pypi:
    needs: [python-wheels, wheel-compat-check]
    if: always() && needs.python-wheels.result == 'success' && needs.wheel-compat-check.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/libsonare
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Tolerate re-runs of the tag workflow after a partial failure:
          # wheels already on PyPI are skipped instead of failing the job.
          skip-existing: true
