<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>audition</title>
<!-- An empty icon, so the browser stops asking for one the server does not have
     and the console stays clear for problems that matter. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <!-- Two views of one thing. The bank is the master and comes first: it says
       where every voice stands, and the listening surface is what one of them
       sounds like. -->
  <div id="viewToggle" class="toggle" role="tablist" aria-label="view">
    <button type="button" role="tab" data-view="bank" aria-selected="false">bank</button>
    <button type="button" role="tab" data-view="listen" aria-selected="true">listen</button>
  </div>
  <label class="pick listen-only">
    <span class="pick-lab">voice</span>
    <select id="setSelect" aria-label="voice"></select>
  </label>
  <!-- Where this voice stands, carried over from the bank. -->
  <span id="headStage" class="head-stage listen-only"></span>
  <h1 id="title">audition</h1>
  <span class="grow"></span>
  <button id="optionsBtn" type="button" class="ghost listen-only" aria-expanded="false"
          aria-controls="options">options</button>
</header>

<!-- Everything that is decided once and then left alone. On screen it is one
     button; the listening surface below stays about what is being listened to. -->
<div id="options" class="options" hidden>
  <div class="opt-col">
    <h2>playback</h2>
    <label class="compare-only"><input type="checkbox" id="matchRms"> match loudness <kbd>M</kbd></label>
    <label class="compare-only"><input type="checkbox" id="restartOnSwitch" checked> switch restarts <kbd>S</kbd></label>
    <label class="compare-only"><input type="checkbox" id="blind"> blind <kbd>B</kbd></label>
    <button id="exportBtn" type="button">export notes</button>
  </div>
  <div class="opt-col">
    <h2>keys</h2>
    <dl class="keys">
      <dt><kbd>space</kbd></dt><dd>play / pause</dd>
      <dt><kbd>↑</kbd><kbd>↓</kbd></dt><dd>take</dd>
      <dt class="compare-only"><kbd>1</kbd>…<kbd>9</kbd> <kbd>←</kbd><kbd>→</kbd></dt><dd class="compare-only">version</dd>
      <dt><kbd>L</kbd></dt><dd>loop</dd>
      <dt class="compare-only"><kbd>M</kbd></dt><dd class="compare-only">match loudness</dd>
      <dt class="compare-only"><kbd>S</kbd></dt><dd class="compare-only">switch restarts</dd>
      <dt class="compare-only"><kbd>B</kbd></dt><dd class="compare-only">blind</dd>
      <dt class="compare-only"><kbd>R</kbd></dt><dd class="compare-only">reveal / reshuffle</dd>
    </dl>
    <p class="hint">Drag across the waveform to set a loop region; a click seeks.</p>
  </div>
  <div class="opt-col wide">
    <h2>about this set</h2>
    <p id="notes" class="hint"></p>
    <p id="sharedNote" class="hint"></p>
  </div>
</div>

<!-- The bank, which is the master: every GM program and GS variation the library
     voices, what engine answers it, how far its calibration has got, and whether
     an oracle has been captured for it at all. Generated by
     tools/voicematch/status.py.

     Three bands. The masthead is the overview — the totals and the distribution
     across the six stages, each step also a filter. The toolbar narrows. The
     table lists, beside an inspector that is always present, so selecting a row
     never resizes the table. -->
<section id="bank" class="bank" hidden>

  <div class="bank-head">
    <div id="bankFigures" class="figures"></div>
    <div class="dist">
      <div id="bankDist" class="dist-bar" aria-hidden="true"></div>
      <div id="bankStageKeys" class="dist-keys" role="group" aria-label="filter by stage"></div>
    </div>
  </div>

  <div class="bank-bar">
    <div id="bankMethod" class="seg4" role="group" aria-label="synthesis method"></div>
    <div id="bankFilter" class="chips" role="group" aria-label="filter"></div>
    <label class="pick grow">
      <span class="pick-lab">find</span>
      <input id="bankFind" type="search" placeholder="name, engine, patch  ( / )"
             aria-label="find a voice">
    </label>
    <label class="pick">
      <span class="pick-lab">sort</span>
      <select id="bankSort" aria-label="sort">
        <option value="address">address</option>
        <option value="stage">stage, highest first</option>
        <option value="name">name</option>
      </select>
    </label>
    <span id="bankCount" class="mono"></span>
  </div>

  <div class="bank-body">
    <div class="bank-table">
      <div class="bank-cols" aria-hidden="true">
        <span>prog</span><span>voice</span><span>engine</span>
        <span>stage</span><span>oracle</span><span>next</span>
      </div>
      <div id="bankRows" role="listbox" aria-label="voices" tabindex="0"></div>
    </div>
    <aside id="bankInspect" class="inspect" aria-live="polite"></aside>
  </div>

</section>

<main>
  <nav id="takes" aria-label="takes"></nav>

  <section id="stage">
    <!-- The console. What is sounding, the switch, and the transport in one
         block that stays put while the readouts scroll under it: switching a
         version and hearing it is the loop, and the two controls were four
         hundred pixels apart with both canvases between them. -->
    <div class="console">
      <div class="ident">
        <div class="crumbs" id="crumbs"></div>
        <span class="grow"></span>
        <code id="identPath" class="path"></code>
        <button id="copyLink" type="button" class="ghost"
                title="Set, take, version, playhead, which strike it is in, and the link that reproduces it">copy what I hear</button>
      </div>

      <div id="versions" class="versions compare-only"></div>
      <p id="versionDetail" class="detail"></p>

      <div id="transport">
        <button id="playBtn" type="button" class="play">play</button>
        <button id="loopBtn" type="button">loop</button>
        <span id="clock" class="mono">0.00 / 0.00</span>
        <span id="levels" class="mono"></span>
        <span class="grow"></span>
        <span id="blindScore" class="mono"></span>
      </div>
    </div>

    <div class="stage-body">
      <figure class="pane">
        <canvas id="wave" height="142"></canvas>
        <figcaption id="waveCaption">waveform — all versions overlaid, active one solid</figcaption>
      </figure>

      <figure class="pane">
        <canvas id="spec" height="212"></canvas>
        <figcaption id="specCaption">spectrogram — active version, log frequency</figcaption>
      </figure>

      <details id="notePanel">
        <summary>notes on this take</summary>
        <textarea id="takeNotes" placeholder="Saved in this browser, and included in the export."></textarea>
      </details>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
