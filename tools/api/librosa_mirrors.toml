# Python functions that mirror a librosa function of the same name.
#
# On the Python surface the spelling of the rate parameter tells the two families apart:
# `sr` with a 22050 default is a librosa mirror with librosa's semantics; `sample_rate`,
# required, is a libsonare operation. No function carries both, and none has `sample_rate`
# with a default. The first argument is `samples` in both families.
#
# A name is listed when librosa has a function of that name with the same meaning and no
# parameter is a librosa parameter under another name. The primary data argument's name is
# exempt, an extra parameter librosa lacks is allowed when its default reproduces librosa's
# behaviour, and parameters that only describe a flat matrix's shape are not counted.
# A family of related functions is all mirrors or all operations, never split.
# Mirrors keep librosa's parameter names, defaults and return shapes, so the naming rules
# for seconds, units, sample-rate names and tuple returns do not apply to them on Python.
# The same-named WASM, Node and C functions are not mirrors.
#
# evidence: "in-tree" = a librosa reference generator or benchmark in this repository
# calls the librosa function; "recalled" = not yet confirmed against an installed librosa.

