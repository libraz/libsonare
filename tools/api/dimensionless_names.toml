# Option, field and flag names that unit-in-name would flag but whose quantity has no unit.
#
# One [[name]] per (surface, symbol); surface "cli" covers both CLI front-ends.
#   surface   wasm | node | python | c | cli-python | cli-native | cli
#   symbol    the qualified name as the inventory spells it (Type.field, fn(param), "cmd --flag")
#   class     ratio | probability | correlation | normalized | magnitude
#   range     [low, high]; inf for no upper bound
#   evidence  what the number is measured against, in one line
# A row that names nothing unit-in-name would flag is a validation problem, so a renamed or
# removed symbol takes its row with it.

[[name]]
surface = "node"
symbol = "ProjectTempoOptions.rampThreshold"
class = "ratio"
range = [0, inf]
evidence = "finite, >= 0 (default 0.02); relative tempo change, no upper bound. src/mir/tempo_estimator_bridge.cpp:127-131; validated src/c_api/project_mir.cpp:85-86"

