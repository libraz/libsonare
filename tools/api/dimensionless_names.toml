# Option, field and flag names that unit-in-name would flag but whose quantity has no unit.
#
# One [[name]] per quantity; its names cover every surface's spelling of it. A name matches
# without its Sonare / sonare_ prefix and with each identifier in snake_case, so
# "SonareBoundaryOptions.threshold", "BoundaryOptions.threshold" and
# "boundary_options.threshold" are one name.
#   names     qualified names as the inventory spells them (Type.field, fn(param), "cmd --flag")
#   class     ratio | probability | correlation | normalized | magnitude
#   range     [low, high]; inf for no upper bound
#   evidence  the header line that states what the number is measured against
# A name that matches nothing unit-in-name would flag is a validation problem, so a renamed or
# removed symbol takes its name with it.

[[name]]
names = [
  "BoundaryOptions.threshold",
  "DetectBoundariesRequest.threshold",
  "detect_boundaries(threshold)",
  "boundaries --threshold",
  "sections --threshold",
]
class = "ratio"
range = [0, inf]
evidence = "include/sonare/sonare_c_types_analysis.h:357: relative to the local novelty maximum"

