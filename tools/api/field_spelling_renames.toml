# C-ABI subject -> facade spelling, per surface, where a facade deliberately names a
# field other than the mechanical spelling of its C name. A row binds only on an entry
# whose facade actually carries the renamed spelling and leaves the C subject unpaired,
# including a subject only a folded second form declares (a list names the spellings
# different entries use);
# gen_field_spelling.py fails on a row that binds nowhere, which is how a row retires
# once the C name or the facade name moves to meet the other.
[node]
reference_sample_rate = "sampleRate"
frame_offset = "startSample"
bytes = "data"
mel = "power"
num_channels = "channels"
in = ["planes", "samples"]
in_channels = "numChannels"
amplitude_envelope = "edit.amplitudeEnvelope"
param_name = ["kind", "param.name"]
base_sample_offset = "startSample"
sample_offset = "startSample"
enable_metering = "enabled"
measure_lufs = "lufs"
measure_true_peak = "truePeak"
input_left = "leftInputs"
input_right = "rightInputs"
max_events = "maxRecords"
output_bus_id = "busId"
overlap_policy = "policy"
preset_name = "name"
meaningful = "controllerVelocityMeaningful"
enabled = "externalMidiClockEnabled"
external = "midiDestinationExternal"
sve1 = "vocalState"
new_track_id = "trackId"
index = "sendIndex"
input = "samples"
track_id = "ref"
inserts_json = "inserts"
source_id = "source.id"
source_track_id = "source.id"
