# C-ABI parameters no facade binds under any spelling, each with the reason a refusal
# cannot name it to a caller. The value starts with one of: "derived length",
# "output", "C-only plumbing", "folded into <field>". gen_field_spelling.py fails on an
# unbound parameter missing here and on an entry that no surface leaves unbound.
# A subject a refusal can name to a caller is bound by a rename or a facade fix instead;
# until that lands it sits under [pending] with the change that retires it, and the
# run fails once it binds.
[pending]
"metering_detect_clipping.threshold" = "unit split: retires on the C rename to threshold_db"

