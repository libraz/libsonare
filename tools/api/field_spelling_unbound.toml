# C-ABI parameters no facade binds under any spelling, each with the reason a refusal
# cannot name it to a caller. The value is one of the closed reason classes: "derived
# length: <param>.length", "output", "C-only plumbing: <what>", "folded into <field>",
# "not exposed". gen_field_spelling.py fails on an unbound parameter missing here and on
# an entry that no surface leaves unbound.
# [unclassified] records, per surface, how many unbound parameters still await a row
# here or a rename; any other count, higher or lower, fails, so each change moves it.
# A subject a refusal can name to a caller is bound by a rename or a facade fix instead;
# until that lands it sits under [pending] with the change that retires it, and the
# run fails once it binds.
