[[entry]]
kind = "flag"
old = "mastering --chain-config"
changed = "the Python CLI reads the document through the library's chain-config reader, as the native CLI does: a document it refuses (an unknown or earlier key, a value outside its domain, a version 2 document without a complete multiband block) exits 5 as an invalid format rather than 3, and the chain runs with every parameter the document leaves out at its default"
domain = "mastering"
rule = "error-class-by-cause"
test = "bindings/python/tests/test_cli_mastering_chain_config.py::test_a_document_the_library_refuses_exits_as_an_invalid_format"

[[entry]]
kind = "command"
old = "project.compile"
changed = "the native CLI's --json diagnostics carry code and severity as the library's tokens (\"danglingSourceRef\", \"warning\", ...) rather than integers, as the Python CLI does"
domain = "project"
rule = "cli-front-end-parity"
test = "tests/cli/cli_project_test.cpp::compile JSON keeps one human message per diagnostic"

