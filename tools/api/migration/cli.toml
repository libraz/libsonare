[[entry]]
kind = "flag"
old = "plp --tempo-min"
to = "plp --bpm-min"
changed = "renamed --bpm-min; omitted, it searches the library's 60-200 BPM range rather than 30-300, so pass --bpm-min 30 --bpm-max 300 for the old search"
domain = "analysis"
rule = "tempo-range"
test = "bindings/python/tests/test_cli_option_advanced.py::test_plp_omitted_bpm_bounds_keep_the_library_range"

[[entry]]
kind = "flag"
old = "plp --tempo-max"
to = "plp --bpm-max"
changed = "renamed --bpm-max; omitted, it searches the library's 60-200 BPM range rather than 30-300, so pass --bpm-min 30 --bpm-max 300 for the old search"
domain = "analysis"
rule = "tempo-range"
test = "bindings/python/tests/test_cli_option_advanced.py::test_plp_omitted_bpm_bounds_keep_the_library_range"

[[entry]]
kind = "flag"
old = "mastering --ceiling-db"
new = "mastering --ceiling-dbtp"
domain = "mastering"
rule = "loudness-names"

[[entry]]
kind = "flag"
old = "mastering-suggest --ceiling-db"
new = "mastering-suggest --ceiling-dbtp"
domain = "mastering"
rule = "loudness-names"

[[entry]]
kind = "flag"
old = "mastering-streaming --platforms"
changed = "each platform is exactly {name, target_lufs, ceiling_dbtp}, all three required; targetLufs, ceilingDb, ceilingDbtp and ceiling_db are refused with the key that replaced them, and a missing target or ceiling no longer defaults to -14 LUFS / -1 dB"
domain = "mastering"
rule = "loudness-names"
test = "tests/cli/cli_mastering_test.cpp::CLI mastering-streaming takes one platform record spelling"

[[entry]]
kind = "command"
old = "vocal-notes"
changed = "the JSON note record no longer carries has_pitch: the pitch keys (median_hz, center_midi, f0_stability, note_name, cents) are absent on an unpitched note, so test for center_midi instead"
domain = "analysis"
rule = "absent-not-sentinel"
test = "bindings/python/tests/test_cli_absent_keys.py::test_vocal_notes_omit_every_pitch_key_of_an_unpitched_note"

[[entry]]
kind = "command"
old = "melody"
frontend = "native"
changed = "the JSON drops has_melody, mean_frequency becomes mean_frequency_hz and vibrato_rate becomes vibrato_rate_hz; with no voiced frame pitch_range_octaves, mean_frequency_hz, pitch_stability and vibrato_rate_hz are absent rather than 0, so test for mean_frequency_hz"
domain = "analysis"
rule = "absent-not-sentinel"
test = "tests/cli/cli_analysis_test.cpp::silence omits every measure read off voiced frames"

[[entry]]
kind = "command"
old = "acoustic"
changed = "the JSON no longer carries is_blind: a blind estimate omits edt, c50, c80, d50 and their band arrays, so test for edt instead"
domain = "analysis"
rule = "absent-not-sentinel"
test = "bindings/python/tests/test_cli_absent_keys.py::test_acoustic_omits_what_only_an_impulse_response_measures"

[[entry]]
kind = "flag"
old = "synthesize-rir --max-seconds"
to = "synthesize-rir --max-sec"
changed = "omit the flag for the natural length; an explicit 0 is refused as a usage error"
domain = "effects"
rule = "seconds-suffix"
test = "tests/conformance/cli_contract_v2.json::max_sec_zero_refused"

[[entry]]
kind = "flag"
old = "room-morph --max-seconds"
to = "room-morph --max-sec"
changed = "omit the flag for the natural length; an explicit 0 is refused as a usage error"
domain = "effects"
rule = "seconds-suffix"
test = "tests/conformance/cli_contract_v2.json::max_sec_zero_refused"

[[entry]]
kind = "command"
old = "suggest-mix"
changed = "the JSON keys tracks, mix and the keys beside scene in snake_case (strip_id, num_channels, integrated_lufs, band_dominance, track_count ...), as mastering-suggest does; scene keeps the scene schema's names because mix --scene reads it back, band tokens keying band_occupancy stay tokens, and a track's name, exclusion_reason or integrated_lufs is absent rather than null when not measured"
domain = "mastering"
rule = "snake-case-only"
test = "tests/cli/cli_mastering_test.cpp::CLI suggest-mix keys its measurements in snake_case and keeps the scene verbatim"

[[entry]]
kind = "flag"
old = "analyze --chroma-highpass"
new = "analyze --chroma-high-pass-hz"
domain = "analysis"
rule = "high-pass"

[[entry]]
kind = "flag"
old = "suggest-mix --tempo-bpm"
changed = "the flag takes auto or a tempo greater than 0; an explicit 0, a negative or a non-number is refused as a usage error naming the flag, and leaving it out (no longer an empty string) keeps the transport's fallback tempo"
domain = "mastering"
rule = "absent-not-sentinel"
test = "tests/conformance/cli_contract_v2.json::tempo_zero_refused"
