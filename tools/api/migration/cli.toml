changed = "use --chroma-method nnls"
to = "chords --chroma-method"
domain = "analysis"
rule = "cli-front-end-parity"
test = "bindings/python/tests/test_cli_option_analysis.py::test_chords_option_flags_override_the_defaults"

[[entry]]
