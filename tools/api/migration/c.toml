[[entry]]
kind = "function"
old = "sonare_engine_set_tempo"
changed = "BPM and any nonzero ramp target must be finite and in [1e-6, 100000] for sonare_engine_set_tempo, sonare_engine_set_tempo_segments and sonare_project_set_tempo_segments. A positive value below 1e-6 was accepted in 1.x and is refused by name. sonare_project_deserialize refuses a loadable document's positive sub-floor tempo as InvalidFormat at its authored field. sonare_transcribe refuses positive sub-floor tempos; pass 0 to detect tempo, while negative and non-finite values are refused."
domain = "engine"
rule = "finite-or-refused"
test = "tests/api/sonare_c_engine_core_refusal_test.cpp::engine tempo floor accepts its endpoint and refuses sub-floor BPM without mutation"

