changed = "takes bpm_min and bpm_max before out_times; pass 60 and 200 for the shared search, an inverted range is INVALID_PARAMETER; audio-derived beat timestamps compensate the onset window's centering and follow the fine-envelope rise instead of reporting the uncorrected analysis frame time. A first beat less than 0.6 ms (60 s / 100000 BPM, the shortest lead-in a tempo map can draw) from the start of the audio is reported at 0 s; the full analysis takes its beats from the same detector."
