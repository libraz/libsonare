[[entry]]
kind = "function"
old = "sonare_project_import_smf"
changed = "a file without time-signature events leaves the stored list empty (1.x inserted 4/4 at tick 0); the project still plays in effective 4/4. An opening signature identical to the next event, including the MIDI click fields, is folded into that later event (1.x kept both)."
domain = "project"
rule = "individual"
test = "tests/midi/smf_roundtrip_test.cpp::SMF import reads the format's 4/4 before a late first time signature"

[[entry]]
kind = "function"
old = "sonare_project_import_clip_file"
changed = "keeps the stored time-signature list empty for a file without signature events and preserves a late first signature at its original position (1.x inserted 4/4 at tick 0 in both cases). An opening signature identical to the next event, including the MIDI click fields, folds into that later event."
domain = "project"
rule = "individual"
test = "tests/api/sonare_c_project_midi_meter_test.cpp::an exported project's meter map imports back unchanged"

[[entry]]
kind = "function"
old = "sonare_engine_set_capture_punch"
changed = "turning punch on while capture is armed with an enabled loop refuses a record offset longer than the loop with SONARE_ERROR_INVALID_PARAMETER and preserves the punch setting; 1.x accepted it. Use sonare_engine_set_capture_timing to change the offset and punch together."
domain = "engine"
rule = "individual"
test = "tests/api/sonare_c_engine_contract_test.cpp::a setup valid as a whole is accepted whatever the separate setters would refuse"

[[entry]]
kind = "function"
old = "sonare_realtime_voice_changer_create"
changed = "with a NULL config, the default uses PSOLA instead of the 1.x grain engine; select grain explicitly to retain the grain algorithm. At 48 kHz the default handle reports 717 instead of 2263 samples of latency."
domain = "effects"
rule = "individual"
test = "tests/api/sonare_c_voice_transform_test.cpp::The default config reports a latency of 717 samples at 48 kHz"

[[entry]]
kind = "function"
old = "sonare_detect_downbeats"
changed = "downbeat positions follow the corrected beat timestamps; phase uses low-frequency energy and harmonic change, so the reported bar starts may differ for the same audio; the tempo search defaults to 60–200 BPM instead of 30–300. A first downbeat less than 0.6 ms (60 s / 100000 BPM) from the start of the audio is reported at 0 s, as its beat is."
domain = "analysis"
rule = "individual"
test = "tests/analysis/downbeat_phase_test.cpp::every analyzer reports one bar phase for the same beats"

