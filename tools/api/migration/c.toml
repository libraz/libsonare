[[entry]]
kind = "export"
old = "SONARE_ABI_VERSION"
changed = "The packed ABI version changes from 0x05030207 to 0x06040308. Rebuild with matching headers and compare against the macro instead of hard-coding the old value. The shared library's SONAME moves from libsonare.so.1 to libsonare.so.2 (install name libsonare.1.dylib to libsonare.2.dylib on macOS), so a program linked against 1.x does not load 2.0 until it is relinked."
domain = "core"
rule = "individual"
test = "tests/api/sonare_c_abi_version_test.cpp::sonare_abi_version mirrors the compile-time aggregate"

