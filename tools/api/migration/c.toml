[[entry]]
kind = "function"
old = "sonare_has_feature"
changed = "new: returns 1 when the named capabilities features key is compiled in, 0 for an absent, unknown or NULL name"
domain = "core"
rule = "abi-probes"
test = "tests/api/surface_core_test.cpp::sonare_has_feature agrees with every capabilities feature"

[[entry]]
