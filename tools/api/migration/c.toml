old = "sonare_engine_set_bus_strip_json"
changed = "takes one bare bus object, the shape a mixer scene holds at buses[i], instead of a whole scene (pass that element, not the scene); every refusal of it, malformed JSON and an unknown key included, is SONARE_ERROR_INVALID_PARAMETER naming settings.<path>, where 1.x refused with SONARE_ERROR_INVALID_FORMAT naming the scene path. An unread insert parameter names settings.inserts[i].params.<key> and lists the insert's accepted keys."
domain = "engine"
rule = "json-input-kinds"
test = "tests/api/sonare_c_engine_strip_test.cpp::sonare_engine_set_bus_strip_json refuses unread insert parameters"

