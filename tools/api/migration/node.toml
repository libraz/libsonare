[[entry]]
kind = "method"
old = "SonareError.constructor"
changed = "new SonareError(code, message, { cause }) replaces the (code, codeName, message) argument order"
domain = "core"
rule = "error-class-by-cause"
test = "bindings/node/tests/surface/core-errors.test.ts::takes (code, message, options) only"

[[entry]]
