[[entry]]
kind = "class"
old = "Audio"
changed = "new Audio(...) is a TypeError naming the factories: build one with Audio.fromBuffer or another factory"
domain = "core"
rule = "construction"
test = "bindings/node/tests/audio-facade-delegation.test.ts::refuses a direct construction with a TypeError naming the factories"

[[entry]]
kind = "method"
old = "StreamingRetune.prepare"
changed = "sampleRate must be an integer in [8000, 384000] Hz and maxBlockSize an integer in [1, 1048576]; fractions and values outside either domain raise RangeError with the argument's domain text (1.x passed a fractional sample rate to the core)."
domain = "effects"
rule = "finite-or-refused"
test = "bindings/node/tests/core-validation-refusals.test.ts::uses the shared domains for fractional and unrepresentable prepare values"

[[entry]]
kind = "method"
old = "StreamingRetune.setConfig"
changed = "the constructor and setConfig check their keys against pitchSemitones, mix and grainSizeSamples: any other key is a TypeError (StreamingRetune.setConfig: unknown key <key> (expected grainSizeSamples, mix, pitchSemitones)), the 1.x grainSize key included, and a refused config leaves the current one in place; a non-finite pitchSemitones or mix is a RangeError reading 'must be finite and in [-24, 24]' ('[0, 1]' for mix). Finite out-of-domain pitch and mix values raise RangeError. A grain outside the supported multiples also raises RangeError. The old configuration clamped controls and rounded the effective grain."
domain = "effects"
rule = "individual"
test = "bindings/node/tests/streaming-retune.test.ts::refuses out-of-range retune controls and keeps the current settings"

