# Excused convention-check violations for tools/api/check_surface.py.
#
# One [[allow]] per decided exception:
#   check     a check id (slug or slug:aspect)
#   surface   wasm | node | python | c | cli-python | cli-native | cli
#   name      fnmatch pattern on the qualified symbol name
#   category  librosa-mirror | platform | wire-format | hot-path | standard-symbol | scalar
#             standard-symbol: token-case only; a symbol fixed by a named standard, never one with a word separator
#             scalar: one-positional-form only; at most four number or boolean parameters and no options
#   reason    one line
# --audit-allowlist fails on an entry that excused nothing in a full run.

[[allow]]
check = "one-positional-form"
surface = "node"
name = "RealtimeEngine.pushMidi*"
category = "hot-path"
reason = "Per-event MIDI push runs once per message; a request object would allocate on every call."

[[allow]]
check = "one-positional-form"
surface = "wasm"
name = "RealtimeEngine.pushMidi*"
category = "hot-path"
reason = "Per-event MIDI push runs once per message; a request object would allocate on every call."

[[allow]]
check = "one-positional-form"
surface = "wasm"
name = "SonareEngine.pushMidi*"
category = "hot-path"
reason = "Worklet-side MIDI push runs on the audio thread, where a per-event allocation is not allowed."

[[allow]]
check = "one-positional-form"
surface = "wasm"
name = "WebMidiEngine.pushMidiInput*"
category = "hot-path"
reason = "Forwards each Web MIDI message as it arrives; a request object would allocate on every call."

[[allow]]
check = "one-positional-form"
