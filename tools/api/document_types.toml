# Types that describe a document, so their keys and values are the core's own, untranslated.
#
# A document is an interchange format the caller authors or persists and the core parses: it has a
# file form and round-trips (the mastering chain config and its overrides, the mix scene, the
# project, the playback renderer config). Everything else is a record, a result the library returns
# or a per-call input bag. A Python record has snake_case attributes whatever its wire form looks
# like, and a JS record spells a value it does not carry as an omitted field, never null; a document
# keeps the core's camelCase keys in Python and the null its schema gives a meaning on every surface.
# A record member holding a document is covered by declaring the document's own type, not the record.
#
# One [[document]] per root type; every type its fields name is covered with it, per surface.
#   type      the root type, as the inventory names it (a Python TypedDict, a TS interface, or both)
#   evidence  path:line: where the core parses or specifies the document
# A root that names no such type, or whose Python types hold no camelCase key, is a validation problem.

[[document]]
type = "PlaybackRendererConfig"
evidence = "schemas/playback-renderer-config.schema.json:5: the published schema, which gives null a meaning for distanceM, channelMap and programLufs"
