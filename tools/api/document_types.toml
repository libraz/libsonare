# Python TypedDicts that describe a document, so their keys are the core's camelCase keys.
#
# A document is an interchange format the caller authors or persists and the core parses: it has a
# file form and round-trips (the mastering chain config and its overrides, the mix scene, the
# project). Everything else is a record, a result the library returns or a per-call input bag, and
# a Python record has snake_case attributes whatever its wire form looks like. A record member
# holding a document is covered by declaring the document's own type, not the record.
#
# One [[document]] per root type; every TypedDict its fields name is covered with it.
#   type      the root TypedDict, as the inventory names it
#   evidence  path:line: where the core parses the document
# A root that names no TypedDict, or whose types hold no camelCase key, is a validation problem.
