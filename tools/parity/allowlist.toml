  "synth_enum_tables",      # facade-visible snapshot built from C enum names
]

# ---------------------------------------------------------------------------
# [coverage] — canonical C functions allowed to be ABSENT on a surface.
# Seed empty: we want to SURFACE coverage gaps, not pre-hide them. Add an
# entry only after confirming the omission is deliberate (e.g. file I/O in WASM).
# ---------------------------------------------------------------------------
[coverage]
# Example (disabled): wasm = ["audio_from_file"]
#
# --- C functions FOLDED INTO the base facade (extended / options variants) ---
# These C entry points are NOT separate facade functions: the base facade
# function exposes them through an options/mode argument or a callback, the same
# pattern as detect_chords -> detect_chords_ex (the template below).
#
#   detect_chords_ex: the facade `detect_chords` IS the extended form (it
#     exposes all SonareChordDetectionOptions fields and calls
#     sonare_detect_chords_ex). So the `_ex` variant is covered, not missing.
#   voice_change_ex: the facade `voiceChange` / `voice_change` IS the extended
#     form -- its `formantMode` / `formant_mode` argument is the `_ex` field.
#     Node and WASM pass it to the core directly; Python calls the C `_ex` entry.
#   detect_key_with_options / _and_modes / _with_extended_options /
#     _with_tuning and the detect_key_candidates_with_modes /
#     _with_extended_options / _with_tuning family: folded into the facade
#     `detect_key` / `detect_key_candidates` extended params (modes / profile /
#     genre_hint, and tuning; detect_key's result reports the tuning used).
#   tempogram_with_mode: folded into `tempogram`'s `mode` selector.
#   (mel_spectrogram_ex / mfcc_ex are credited by _ALIAS_COVERAGE in compare.py,
#    anchored to the base mel_spectrogram / mfcc facade which now exposes the
#    fmin/fmax/htk arguments and routes to the _ex C entry point — so they are
#    not allowlisted here.)
#   project_auto_tempo_ex / project_snap_to_grid_ex: folded into each Project
#     facade's base auto-tempo / snap-to-grid method. The extended candidate,
#     meter-apply, and division arguments are public optional parameters and the
#     wrappers call the corresponding C `_ex` entry points; the defaults match
#     the legacy base calls.
#   project_analyze_tempo_with_options / project_auto_tempo_with_options: folded
#     into the same two Project facade methods. The bridge options become an
#     optional options bag on Node/WASM and keyword arguments on Python, and both
#     wrappers now call the with-options entry points; passing nothing reproduces
#     the fixed-signature calls exactly.
#   project_bake_midi_fx_ex: folded into each Project facade's bake-MIDI-FX
#     method. The provenance buffer becomes a `withSourceIndex` request field on
#     Node/WASM and a `with_source_index` keyword on Python, and the wrapper
#     calls the C `_ex` entry point; omitting it reproduces the base call. The
#     companion sizing entry point project_preview_midi_fx_count is a real
#     facade method on all three surfaces and is NOT allowlisted.
#   error_message / last_error_message / last_error_code / last_diagnostic_count /
#     last_diagnostic / diagnostic_init: C-ABI error and diagnostic channel accessors
#     consumed internally by each facade (errors map to native exceptions; the
#     scene-load warning surfaces as Mixer.sceneWarnings / scene_warnings; the
#     diagnostic list becomes RirResult.diagnostics / RoomMorphResult.diagnostics),
#     not standalone public facade functions. Node and WASM read the scene-load
#     warnings through these and the RIR diagnostics from the core's own
#     std::vector<Diagnostic>.
# --- default seeders for C-only options structs ---
#   A C struct cannot spell "field omitted", so the C ABI ships a seeder that
#   fills one with the core config's values. No facade needs a free function for
#   it: an omitted keyword or an absent request field already means "default"
#   there. Each seeder below was checked against what the facades actually spell,
#   and the values agree.
#   Vocal-edit `*_init` seeders (vocal_*, project_vocal_*): each zero-fills one
#     caller-owned result or request POD and sets its schema version. The facades
#     build those values as plain objects, so none has a free-function
#     counterpart.
#   boundary_options_default: Node reads the seeder live, WASM starts from
#     BoundaryConfig itself, and Python's detect_boundaries keyword defaults are
#     held to it by test.
#   meter_options_default: same three routes, against MeterConfig and
#     estimate_meter.
#   music_analyze_options_default: same, against MusicAnalyzerConfig and
#     analyze. Only four of the nineteen Python defaults are pinned by a test;
#     the rest agree without anything holding them.
#   transcribe_config_default: the struct the facades deliberately do NOT
#     forward — sonare_c_transcribe.h states that a zero field means the default
#     in C and does not in a binding, so Python and WASM spell absence
#     themselves and only Node reads the seeder.
#   section_options_default: Node and Python seed SonareSectionOptions from it
#     before overlaying the caller's fields; WASM's analyzeSections spells
#     n_fft 2048, hop 512 and 4 s itself and leaves an omitted threshold to the
#     core, matching the seeder.
#   project_tempo_options_default: all three facades call it internally to seed
#     SonareProjectTempoOptions before overlaying the caller's fields, so no
#     facade restates a value.
#   note_target_assign_config_default: the same route on all three, and here it
#     is forced rather than preferred. min_overlap_ratio and
#     max_correction_semitones both take 0 as a legal value — any overlap counts,
#     and no note moves — so a facade cannot read 0 as "unset", and restating the
#     defaults as literals would make it a second source of truth for values the
#     core struct already owns. Each facade calls the seeder and overlays only
#     the fields the caller supplied.
#   mixer_strip_at: the handle->index convention the [order] notes already
#     record for strip_meter. No facade hands out a SonareStrip*; every strip op
#     takes an index or an id and resolves the borrowed handle internally.
#   mixer_add_strip_ex: folded into the facade `addStrip` / `add_strip`, whose
#     optional metering argument IS the `_ex` parameter set -- `enabled` / `lufs`
#     / `truePeak` / `truePeakOversample` on Node and WASM, the matching keywords
#     on Python, under the same names the scene document spells them. Omitting it
#     reproduces the base sonare_mixer_add_strip call exactly. The base entry
#     point is NOT allowlisted: it is the facade method.
#   engine_set_synth_instrument_with_bank: folded into each facade's
#     set_synth_instrument as an optional sample-bank argument, which is
#     where the bank already lives for the bounce path. The plain C entry
#     point is the same call with no bank, so exposing both would put two
#     names on one operation. WASM reaches the same behaviour without calling
#     this C function at all: c_api/sonare_c_engine_midi.cpp is not in the
#     WASM source list, so its realtime binding constructs the NativeSynth
#     directly and hands it the same shared bank one layer lower.
#   engine_set_synth_instrument_binding: same fold, one C entry point wider.
#     Node and Python route set_synth_instrument's useGmPrograms/sampleBank
#     through this call now (a SonareSynthInstrumentBinding carries both), so
#     it IS reachable there -- just under the facade's existing method name,
#     which the name-matching extractor does not credit. WASM still constructs
#     the NativeSynth directly, as above.
