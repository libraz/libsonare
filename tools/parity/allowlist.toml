  "pitch_correct_to_midi_timevarying",
  "pitch_correct_timevarying",
  "midi_cc_learn",
  "midi_route_events",
  "spectral_edit",
  "mel_to_stft",  # Python facade derives matrix extents from sequences; C requires explicit dims
  "mel_to_audio", # Python facade derives matrix extents from sequences; C requires explicit dims
  "mfcc_to_audio", # Python facade derives matrix extents from sequences; C requires explicit dims
]

# ---------------------------------------------------------------------------
# [default] — "key.param" entries whose default may differ across facades.
# Seed empty: default drift is the highest-value signal; do not pre-hide it.
# ---------------------------------------------------------------------------
[default]
# Empty-collection sentinels (Node/WASM `[]` vs Python `None`, both meaning
# "no value") and enum-member-vs-string-union spellings (`SendTiming.POST_FADER`
# vs `postFader`) are folded to a common form in compare._default_drift /
# normalize.canonical_default, so they are NOT allowlisted per-key here. That
# covers mastering_streaming_preview.platforms, add_vca_group.members, and the
# add_send/meter_tap/strip_meter/schedule_*_automation enum defaults generally.
#
# set_builtin_instrument.destination_id: all three facades default it to 0.
# Node/WASM read it from the config object (`config.destinationId ?? 0`) while
# Python takes it as a separate `destination_id=0` keyword arg (the dataclass
# config is the synth patch; the routing target is a distinct concern). Same
# default, idiomatic representation difference — not behavioural drift.
# set_sf2_instrument.destination_id: identical situation for the SF2 player
# entry (same 0 default, same config-object vs keyword-arg representation).
# set_synth_instrument.destination_id: identical situation for the NativeSynth
# entry (same 0 default; Node/WASM read patch.destinationId when the patch is
# an object — preset-name strings carry no routing — Python keyword arg).
params = [
  "set_builtin_instrument.destination_id",
  "set_sf2_instrument.destination_id",
  "set_synth_instrument.destination_id",
]

# ---------------------------------------------------------------------------
# [core_default] — "key.param" entries whose facade default is ALLOWED to differ
# from the C++ core config-struct field initializer (compare._core_default_drift,
# driven by core_map.toml). Use ONLY for an intentional facade-vs-core
# difference, e.g. a "0 = use library default" sentinel the facade exposes that
# the core struct spells as its concrete value. Seed empty: every mapped numeric
# / boolean default currently matches its core struct initializer.
# ---------------------------------------------------------------------------
[core_default]
params = []

# ---------------------------------------------------------------------------
# [enum] — "key.param" entries whose enum value-sets may differ across surfaces.
# TS unions often carry extra alias spellings (e.g. 'stereo-pan' + 'stereoPan')
# that the C enum lacks; add reviewed aliases here.
# ---------------------------------------------------------------------------
[enum]
params = []

# ---------------------------------------------------------------------------
# [input_naming] — canonical keys whose audio-input params (samples/sr/...) are
# allowed to be named differently across surfaces. Seed empty: input naming is
# real signal worth triaging.
# ---------------------------------------------------------------------------
[input_naming]
# WASM renames the primary feature-buffer input for clarity: `mel` -> `melPower`
# and `mfcc` -> `mfccCoefficients`. Same buffer, descriptive spelling — not a
# drift. (Node and C keep `mel` / `mfcc`.)
keys = ["mel_to_stft", "mel_to_audio", "mfcc_to_mel", "mfcc_to_audio"]

# ---------------------------------------------------------------------------
# [wasm_internal] — WASM embind / SonareModule / index.ts names whose
# intra-binding wiring inconsistency is intentional. This suppresses the ACTIVE
# legs (a free embind registration not in the SonareModule type, or an index.ts
# `module.X` call not in the type). The INFORMATIONAL "typed but no facade
# wrapper" leg is already non-gating, so the current cases (detectKey /
# detectKeyCandidates superseded by `_detectKeyWithOptions` / `_detectKeyCandidates`,
# and the unwrapped `mixerPresetJson`) need no entry here. Seed empty: a missing
# type declaration is a real TS break worth surfacing.
# ---------------------------------------------------------------------------
[wasm_internal]
names = []

# ---------------------------------------------------------------------------
# [tuning] — central knobs. Leave empty to use the built-in defaults in
# compare.py. Set these only to override.
#   input_roles:     leading audio-input param names stripped before the
#                    config-order comparison (and compared by the input check).
#   handle_prefixes: C name prefixes treated as handle/class APIs (coverage of
#                    these is informational; matched against facade class methods).
# ---------------------------------------------------------------------------
[tuning]
# input_roles = ["samples", "sample_rate", "sr", "left", "right", "mono", "audio", "x", "y", "buffer", "data", "length"]
# handle_prefixes = ["audio", "eq", "mixer", "engine", "strip", "stream", "streaming", "realtime", "voice", "free", "master"]

# ---------------------------------------------------------------------------
# [record] — RECORD-SHAPE unit (the second extraction unit). Intentional,
# reviewed divergences between a facade's declared record and the C struct that
# is its oracle. Three entry kinds, narrowest first: `fields` (one field),
# `extra_fields` (a richer facade read model; MISSING C fields still report),
# `records` (whole record — blunt, suppresses missing fields too).
#
# A record that merely SHARES A NAME with an unrelated C struct does NOT belong
# here: that is a matching fact, and it lives in `_NOT_A_C_MIRROR` in compare.py.
# ---------------------------------------------------------------------------
[record]
# Category 1 (ergonomic rename or fold) and category 2 (array-length derivation).
# Every entry below was read against both the C header and the facade source.
fields = [
  # --- category 2 + 1: parallel C arrays folded into one array-of-struct ---
  # C carries `stage_gain_reduction_stages` (char**) and
  # `stage_gain_reduction_values` (float*) plus their shared count; both JS
  # facades expose the zipped `stageGainReductions: StageGainReduction[]`.
  "mastering_chain_result.stage_gain_reduction_stages",
  "mastering_chain_result.stage_gain_reduction_values",
  "mastering_chain_result.stage_gain_reductions",
  "mastering_chain_stereo_result.stage_gain_reduction_stages",
  "mastering_chain_stereo_result.stage_gain_reduction_values",
  "mastering_chain_stereo_result.stage_gain_reductions",

  # --- category 2 + 1: interleaved buffer + frame count -> one typed array ---
  # C takes `audio_interleaved` (const float*) with `audio_frames`; both JS
  # facades pass `audio: Float32Array` and derive the frame count from it.
  "project_clip_desc.audio_interleaved",
  "project_clip_desc.audio_frames",
  "project_clip_desc.audio",
  "project_loop_recording_desc.audio_interleaved",
  "project_loop_recording_desc.audio_frames",
  "project_loop_recording_desc.audio",

  # --- category 1: ordinal -> string union, and a clearer field name ---
  # C `kind` (SonareProjectTempoCandidateKind ordinal) is spelled `label`
  # ('primary' | 'half' | 'double'); C `first_time_signature` is `timeSignature`.
  "project_tempo_candidate.kind",
  "project_tempo_candidate.label",
  "project_tempo_candidate.first_time_signature",
  "project_tempo_candidate.time_signature",

  # --- category 1: a C function argument folded into the facade config bag ---
  # The C ABI passes the MIDI destination id (and, for the synth patch, the
  # GM-program follow flag) as separate arguments to the bounce entry points;
  # every facade folds them into the config object. bindings/node/src/project.ts
  # states this in the bounceWithSynthInstrument docs ("`destinationId` and
  # `useGmPrograms` are JS binding" fields).
  "builtin_synth_config.destination_id",
  "sf2_instrument_config.destination_id",
  "synth_patch.destination_id",
  "synth_patch.use_gm_programs",

  # --- category 1: two C accessors merged into one facade read model ---
  # The facade's source descriptor also carries the owning audio metadata, which
  # the C ABI serves from sonare_project_get_audio_source_metadata (already
  # credited to `source_by_index` in compare._ALIAS_COVERAGE).
  "project_source.content_hash",
  "project_source.external_stem_role",

  # --- category 4: intentionally one-sided facade additions ---
  # Documented MIDI 1.0 aliases for the first two UMP words; the comments in
  # bindings/node/src/types_engine.ts call them "Project-style alias".
  "engine_midi_event.data0",
  "engine_midi_event.data1",
  # Human-readable text derived from the diagnostic `code`; the C POD carries
  # the ordinal only.
  "project_diagnostic.message",

  # --- category 1: canonical name strings beside a C enum ordinal ---
  # Both JS facades add the core's canonical spelling next to the ordinal, and
  # say so in-file ("Canonical core spelling; stable across all language
  # bindings").
  "key.name",
  "key.short_name",
  "section.name",
  "chord.name",
  "chord.root_name",
  "chord.bass_name",

  # --- category 1: a span reported as its two endpoints plus their difference ---
  # The C struct carries `start` and `end`; every facade also exposes the span
  # itself, because a caller asking "how long is this chord" should not have to
  # subtract. Python derives it as a property, Node computes it in the addon,
  # WASM computes it in the result converter, and all three define it as
  # `end - start`, so the three agree on both the name and the value.
  "chord.duration",
]

# Category 4 (intentionally one-sided): the facade record is a RICHER read model
# than the C struct, so extra fields are expected while a MISSING C field still
# reports. `SonareAnalysisResult` is the lean POD returned by the struct-based C
# entry points; the TS `AnalysisResult` mirrors the parsed sonare_analyze_json
# document (nested beats / chords / sections / timbre / dynamics / rhythm /
# melody / form). Stated as a direction rather than as a field list so the entry
# stays correct as the analysis document grows.
[record.extra_fields]
node = ["analysis_result"]
wasm = ["analysis_result"]

# Whole-record suppression. Empty on purpose: it hides missing C fields too,
# which is the drift this unit exists to catch. Reach for `extra_fields` or
# `fields` instead.
[record.records]
