# Parity-checker allowlist: intentional, reviewed divergences.
# See README.md for the meaning of each section and how to add an entry.
# Keys are the canonical snake_case names (C name without the `sonare_` prefix).

# ---------------------------------------------------------------------------
# [surface_only] — symbols with NO C-API counterpart that are intentional.
# These are platform-specific helpers, not coverage drift.
# Suffix/prefix wildcards (`*progress`, `engine_*`) are supported.
# ---------------------------------------------------------------------------
[surface_only]
# Symbols that exist on multiple bindings but are deliberately binding-only.
# The `mix_stereo` entry is an ERGONOMIC
# facade free-function name with no C function of the same name. Renaming the
# public facade API to mirror C is out of scope, so it is intentional, not
# drift. (The named mastering processors and analyses are credited through
# compare.py's _ALIAS_COVERAGE instead.)
#   mix_stereo               <- stereo mix convenience
# The facade validation helpers (`assert_samples`, `assert_u7`, `midi1_event`
# and the rest of that family) are NOT listed here. They live in modules the
# index re-exports a TYPE from and no value, so they are importable by their
# siblings and by nothing else — which the extractor now derives, the same way
# it derives a folded argument order. An entry for one of them would excuse a
# gap no caller can reach, and would go on excusing it after the helper became
# public for real.
any = [
  "init",                  # WASM async module init
  "mix_stereo",
]

node = [
  "analyze_async",          # libuv async variant, JS-only
  "master_audio_async",         # libuv async variant, JS-only
  "master_audio_stereo_async",  # libuv async variant, JS-only
  "synth_enum_tables",      # facade-visible snapshot built from C enum names
  "is_sonare_error",        # TS type guard for the SonareError shape; no C symbol
]

wasm = [
