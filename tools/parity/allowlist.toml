# ---------------------------------------------------------------------------
# [coverage] — canonical C functions allowed to be ABSENT on a surface.
# Seed empty: we want to SURFACE coverage gaps, not pre-hide them. Add an
# entry only after confirming the omission is deliberate (e.g. file I/O in WASM).
# ---------------------------------------------------------------------------
[coverage]
# Example (disabled): wasm = ["audio_from_file"]
#
# --- C functions folded into the base facade (extended / options variants) ---
#   (mel_spectrogram_ex / mfcc_ex are credited by _ALIAS_COVERAGE in compare.py,
#    anchored to the base mel_spectrogram / mfcc facade which now exposes the
#    fmin/fmax/htk arguments and routes to the _ex C entry point — so they are
#    not allowlisted here.)
#   error_message / last_error_message / last_error_code / last_diagnostic_count /
#     last_diagnostic / diagnostic_init: C-ABI error and diagnostic channel accessors
#     consumed internally by each facade (errors map to native exceptions; the
#     scene-load warning surfaces as Mixer.sceneWarnings / scene_warnings; the
#     diagnostic list becomes RirResult.diagnostics / RoomMorphResult.diagnostics),
#     not standalone public facade functions. Node and WASM read the scene-load
#     warnings through these and the RIR diagnostics from the core's own
#     std::vector<Diagnostic>.
# --- default seeders for C-only options structs ---
#   A C struct cannot spell "field omitted", so the C ABI ships a seeder that
#   fills one with the core config's values. No facade needs a free function for
#   it: an omitted keyword or an absent request field already means "default"
#   there. Each seeder below was checked against what the facades actually spell,
#   and the values agree.
#   Vocal-edit `*_init` seeders (vocal_*, project_vocal_*): each zero-fills one
#     caller-owned result or request POD and sets its schema version. The facades
#     build those values as plain objects, so none has a free-function
#     counterpart.
