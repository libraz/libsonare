# ---------------------------------------------------------------------------
# [order] — keys whose facade param order legitimately differs from the C ABI
# beyond the options-bag-prefix convention. Seed empty.
# ---------------------------------------------------------------------------
[order]
# scale_quantize_midi / scale_correction_semitones: C orders the optional
# reference pitch BEFORE the value being quantized (root, mode_mask,
# reference_midi, midi). All facades use the ergonomic order (root, mode_mask,
# midi, reference_midi=default) and remap to C order internally (verified in the
# addon / embind / ctypes wrappers).
#
# preemphasis / deemphasis: C is (coef, zi, use_zi); Node/WASM expose
# (coef, zi?) and derive use_zi from whether zi was supplied.
# tempogram: the facades expose a single `mode` selector (cyclic / fourier /
# autocorr) that folds the C `center` / `norm` flags; Node/WASM replace
# center+norm with `mode`, Python keeps center+norm and adds `mode`. Documented
# ergonomic convenience, not order drift.
# strip_meter (wasm/node): the C handle method `sonare_strip_meter` takes a
# `strip` handle; the facades follow the documented handle->index convention
# (the handle becomes a numeric `strip_index`) and add a `tap` metering-tap
# selector, the same extended-facade shape already accepted for strip_meter
# (python) below. Same op, handle->index + tap-selector — not order drift.
# lufs_interleaved: C is (samples, frames, channels, sample_rate). All facades
# expose (samples, channels, sample_rate) and DERIVE frames = len(samples) /
# channels internally — passing both an interleaved buffer and a redundant frame
# count would let them disagree. The frames-derived shape is the documented
# cross-binding convention; not order drift.
# chord_functional_analysis: C is (options-bag, key_root, key_mode); the facades
# put (key_root, key_mode) first and INLINE the SonareChordDetectionOptions
# fields after them — the same ergonomic options-inlining + key-first shape
# already used for detect_chords. Remapped internally; not order drift.
# analyze_melody (node/python): the facade appends the extended use_pyin/center
# params that map to C sonare_analyze_melody_ex; the base C analyze_melody lacks
# them. Folded extended-facade params, not order drift. (WASM passes them via an
# options object, so it is not flagged here.)
# pitch_correct_to_midi_timevarying (all): C is (f0_hz, voiced_prob, voiced,
# n_frames, hop_length, target_midi). Every facade uses the ergonomic order
# (f0_hz, target_midi, hop_length, voiced?, voiced_prob?) and DERIVES n_frames
# from the f0_hz array length — passing both the contour array and a redundant
# frame count would let them disagree. Remapped to C order internally (ctypes /
# addon / embind wrappers). Documented ergonomic convenience, not order drift.
# pitch_correct_timevarying (all): C is (f0_hz, voiced_prob, voiced, n_frames,
# hop_length, config). Every facade exposes (f0_hz, sampleRate, hopLength, ...)
# and DERIVES n_frames from the f0_hz array length, then folds the
# SonarePitchCorrectionConfig fields + the voiced/voicedProb companion arrays —
# Node/WASM into a trailing PitchCorrectOptions bag, Python into keyword args.
# Same ergonomic options-fold + array-length derivation as spectral_edit /
# pitch_correct_to_midi_timevarying. Remapped to C order internally. Not order drift.
# midi_cc_learn (node/wasm/python): C is (events, count, param_id, min_value,
# max_value, min_movement). The facades DERIVE `count` from the events array
# length; Node/WASM additionally fold the optional (min_value, max_value,
# min_movement) range params into a MidiCcLearnOptions bag (Python keeps them as
# keyword args). Passing both the array and a redundant count would let them
# disagree. Remapped to C order internally; ergonomic convenience, not order drift.
# midi_route_events (all): C is (events, count, config). Every facade exposes
# (events, config) and DERIVES `count` from the events array length — same
# array-length derivation as lufs_interleaved. (The facade method is
# `midiRouteEvents` / `route_midi_events`, mapped to this C key.)
# spectral_edit (all): C is (config, ops, n_ops). Every facade exposes (ops, ...)
# and DERIVES `n_ops` from the ops array length, then folds the
# SonareSpectralEditConfig fields — Node/WASM into a trailing options bag
# (nFft/hopLength/window/healRadiusFrames), Python into keyword args. Passing both
# the ops array and a redundant count would let them disagree; same ergonomic
# options-fold + array-length derivation already accepted for midi_route_events.
# Remapped to C order internally (addon / embind / ctypes). Not order drift.
