# ---------------------------------------------------------------------------
# [coverage] — canonical C functions allowed to be ABSENT on a surface.
# Seed empty: we want to SURFACE coverage gaps, not pre-hide them. Add an
# entry only after confirming the omission is deliberate (e.g. file I/O in WASM).
# ---------------------------------------------------------------------------
[coverage]
# Example (disabled): wasm = ["audio_from_file"]
#
# --- C functions FOLDED INTO the base facade (extended / options variants) ---
# These C entry points are NOT separate facade functions: the base facade
# function exposes them through an options/mode argument or a callback, the same
# pattern as detect_chords -> detect_chords_ex (the template below).
#
#   detect_chords_ex: the facade `detect_chords` IS the extended form (it
#     exposes all SonareChordDetectionOptions fields and calls
#     sonare_detect_chords_ex). So the `_ex` variant is covered, not missing.
#   detect_key_with_options / _and_modes / _with_extended_options and the
#     detect_key_candidates_with_modes / _with_extended_options family: folded
#     into the facade `detect_key` / `detect_key_candidates` extended params
#     (modes / profile / genre_hint).
#   tempogram_with_mode: folded into `tempogram`'s `mode` selector.
#   (mel_spectrogram_ex / mfcc_ex are credited by _ALIAS_COVERAGE in compare.py,
#    anchored to the base mel_spectrogram / mfcc facade which now exposes the
#    fmin/fmax/htk arguments and routes to the _ex C entry point — so they are
#    not allowlisted here.)
#   onset_strength: exposed by the facades under the ergonomic name
#     `onset_envelope`.
#   project_auto_tempo_ex / project_snap_to_grid_ex: folded into each Project
#     facade's base auto-tempo / snap-to-grid method. The extended candidate,
#     meter-apply, and division arguments are public optional parameters and the
#     wrappers call the corresponding C `_ex` entry points; the defaults match
#     the legacy base calls.
#   project_analyze_tempo_with_options / project_auto_tempo_with_options: folded
#     into the same two Project facade methods. The bridge options become an
#     optional options bag on Node/WASM and keyword arguments on Python, and both
#     wrappers now call the with-options entry points; passing nothing reproduces
#     the fixed-signature calls exactly.
#   project_bake_midi_fx_ex: folded into each Project facade's bake-MIDI-FX
#     method. The provenance buffer becomes a `withSourceIndex` request field on
#     Node/WASM and a `with_source_index` keyword on Python, and the wrapper
#     calls the C `_ex` entry point; omitting it reproduces the base call. The
#     companion sizing entry point project_preview_midi_fx_count is a real
#     facade method on all three surfaces and is NOT allowlisted.
#   error_message / last_error_message / last_warning_message: C-ABI
#     error/warning-string helpers consumed internally by each facade (errors map
#     to native exceptions; the scene-load warning surfaces as Mixer.sceneWarnings
#     / scene_warnings), not standalone public facade functions.
# --- mastering ops exposed under ERGONOMIC facade names (see [surface_only]) ---
#   mastering_analyze_pair / mastering_analyze_stereo / mastering_apply_processor
#   / mastering_apply_pair_processor / mastering_apply_processor_stereo: these C
#   operations are surfaced by the facade free functions mastering_pair_analyze /
#   mastering_stereo_analyze / mastering_process / mastering_pair_process /
#   mastering_process_stereo (listed in [surface_only] below). Same op, facade
#   spelling.
