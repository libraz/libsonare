  # the numeric param transport carries; the public Python API takes the name,
  # and mastering_platform_names() exposes the accepted set.
  "mastering_platform_from_name",
  # The same for the assistant's preset name; mastering_preset_names() lists it.
  "mastering_preset_from_name",
  # See the Node note: the composition-assist seam is C-ABI and C++ only. The
  # layer that would plug into it is TypeScript, so a Python-only exposure would
  # be an asymmetry needing its own reason rather than a quiet re-expansion.
  "assist_module_ids",
  "project_assist_preview_json",
  "project_assist_apply_json",
]

# ---------------------------------------------------------------------------
# [order] — keys whose facade param order legitimately differs from the C ABI
# beyond the options-bag-prefix convention. Seed empty.
# ---------------------------------------------------------------------------
[order]
# A JS facade that takes a request object declares no parameter order at all, so
# the comparison is not made and the report says so per (key, surface). Those
# need no entry here, which is why most of the keys below are listed for python
# alone: the same fold that removes the divergence removes the comparison, and it
# comes back on its own if a facade returns to positional parameters.
#
# What the JS facades do with those folded arguments does not follow from any
# signature, so it is recorded here rather than left to an entry that suppresses
# nothing:
#   preemphasis / deemphasis  C is (coef, zi, use_zi); Node and WASM expose
#     (coef, zi?) and DERIVE use_zi from whether zi was supplied.
#   tempogram                 Node and WASM REPLACE the C center / norm flags
#     with the `mode` selector; Python keeps center + norm and adds `mode`.
#   pitch_correct_timevarying / spectral_edit  the JS request fields are a
#     PitchCorrectOptions bag and nFft / hopLength / window / healRadiusFrames.
#   analyze_melody            WASM passes the extended use_pyin / center params
#     through an options object rather than appending them positionally.
#   Across this whole group, every facade — not only the one listed below —
#   derives the C count / extent arguments from array length and remaps to the C
#   order inside its own wrapper (addon / embind / ctypes).
#
# scale_quantize_midi / scale_correction_semitones: C orders the optional
# reference pitch BEFORE the value being quantized (root, mode_mask,
# reference_midi, midi). All facades use the ergonomic order (root, mode_mask,
# midi, reference_midi=default) and remap to C order internally (verified in the
# addon / embind / ctypes wrappers).
#
# tempogram (python): the facade exposes a single `mode` selector (cyclic /
# fourier / autocorr) that folds the C `center` / `norm` flags, keeping
# center+norm alongside it. Documented ergonomic convenience, not order drift.
# strip_meter (wasm/node): the C handle method `sonare_strip_meter` takes a
# `strip` handle; the facades follow the documented handle->index convention
# (the handle becomes a numeric `strip_index`) and add a `tap` metering-tap
# selector, the same extended-facade shape already accepted for strip_meter
# (python) below. Same op, handle->index + tap-selector — not order drift.
# chord_functional_analysis (python): C is (options-bag, key_root, key_mode); the
# facade puts (key_root, key_mode) first and INLINES the
# SonareChordDetectionOptions fields after them — the same ergonomic
# options-inlining + key-first shape already used for detect_chords. Remapped
# internally; not order drift.
# voice_change (python): the facade appends `formant_mode`, which maps to the
# `formant_mode` field of the C sonare_voice_change_ex config; the base C
# voice_change lacks it. Folded extended-facade param, not order drift.
# analyze_melody (python): the facade appends the extended use_pyin/center params
# that map to C sonare_analyze_melody_ex; the base C analyze_melody lacks them.
# Folded extended-facade params, not order drift.
# midi_cc_learn (python): C is (events, count, param_id, min_value, max_value,
# min_movement). The facade DERIVES `count` from the events array length and keeps
# the range params as keyword args. Passing both the array and a redundant count
# would let them disagree. Remapped to C order internally; ergonomic convenience,
# not order drift. Node and WASM carry no entry: their request object declares no
# order.
# midi_route_events (python): C is (events, count, config). The facade exposes
# (events, config) and DERIVES `count` from the events array length. Node and WASM carry no entry: their
# trailing options bag is structural, so what reaches the comparison is a strict
# prefix of the C order and there is nothing left to excuse. (The facade method is
# `midiRouteEvents` / `route_midi_events`, mapped to this C key.)
# split_note / merge_notes (python): C is (samples, length, sample_rate, f0_hz,
# voiced_prob, voiced, n_frames, frame_rate, ...). The facade DERIVES n_frames from
# the f0_hz array length and folds the SonareNoteExtractorConfig fields and the
# voiced / voiced_prob companions into keyword args. It also drops `envelopes`: the
# C signature passes one pooled array because SonareNoteEdit indexes it by offset,
# while the facade hands each note its own envelope, so there is no pool for the
# argument to name. Same fold recorded for note_edit under [record].
# split_silence_common (python): C is (signals, signal_count, lengths, top_db,
# frame_length, hop_length). The facade takes one sequence of sequences and
# DERIVES both the count and the per-signal `lengths` array from it — a Python
# caller holding a list of takes has no second place to state their lengths, and
# passing one alongside would let the two disagree. Same array-length derivation
# as midi_route_events, on a ragged input. Node and WASM carry no entry: their
# request object declares no order, so nothing reaches the comparison.
#
# downmix (all facades): C is (channels, frames, channel_count, target_layout) over one
# packed planar block. Every facade takes (channels, target_layout) with one array
# per channel and DERIVES frames and channel_count from them.
node = [
  "scale_quantize_midi",
  "scale_correction_semitones",
  "strip_meter",
  "downmix",
  "chord_symbol_from_analysis", # the facade folds root/quality/bass into one analysis chord object and sizes the extensions array itself
]
wasm = [
  "scale_quantize_midi",
  "scale_correction_semitones",
  "strip_meter",
  "downmix",
  "chord_symbol_from_analysis", # the facade folds root/quality/bass into one analysis chord object and sizes the extensions array itself
]

# detect_key_candidates (python): exposes `modes, profile, genre_hint` extras
# that map to the extended C variants (detect_key_candidates_with_modes /
# _with_extended_options). strip_meter (python): the extra `tap` selector maps
# to the metering-tap variant. Both are legitimate extended-facade params.
# scale_quantize_midi / scale_correction_semitones (python): same ergonomic
# (root, mode_mask, midi, reference_midi=default) order as Node/WASM above,
# remapped to the C order internally by the ctypes wrapper.
python = [
  # chord_functions: Python takes (chords, key) and derives the count from the list
  # and splits `key` into the C root/mode pair; the C out-arrays become the added
  # roman/function fields.
  "chord_functions",
  "detect_key_candidates",
  "strip_meter",
  "tempogram",
  "scale_quantize_midi",
  "scale_correction_semitones",
  "chord_functional_analysis",
  "analyze_melody",
  "voice_change",
  "midi_cc_learn",
  "midi_route_events",
  "split_note",
  "merge_notes",
  "split_silence_common",
  "mastering_ab_match_loudness", # Python derives both C lengths from array length, folds the optional out_match into `with_match`, and takes reference_sample_rate as a keyword that defaults to sample_rate
  "mastering_ab_match_loudness_stereo", # Python derives both stereo lengths, folds optional out_match into with_match and defaults reference_sample_rate, as in the mono API
  "align_take_to_reference", # Python derives both C lengths from array length and folds the SonareTakeAlignConfig fields into keyword args
  "downmix", # Python derives frames and channel_count from the channel arrays
  "chord_symbol_from_analysis", # the facade folds root/quality/bass into one analysis chord object and sizes the extensions array itself
  "mixing_assistant_suggest", # Python takes one list of MixAssistantTrack records and derives the per-track id/name/channel/length/rate arrays and the count from it
]

# ---------------------------------------------------------------------------
# [default] — "key.param" entries whose default may differ across facades.
# Seed empty: default drift is the highest-value signal; do not pre-hide it.
# ---------------------------------------------------------------------------
[default]
# Empty-collection sentinels (Node/WASM `[]` vs Python `None`, both meaning
# "no value") and enum-member-vs-string-union spellings (`SendTiming.POST_FADER`
# vs `postFader`) are folded to a common form in compare._default_drift /
# normalize.canonical_default, so they are NOT allowlisted per-key here. That
# covers mastering_streaming_preview.platforms, add_vca_group.members, and the
# add_send/meter_tap/strip_meter/schedule_*_automation enum defaults generally.
params = []

# ---------------------------------------------------------------------------
# [core_default] — "key.param" entries whose facade default is ALLOWED to differ
# from the C++ core config-struct field initializer (compare._core_default_drift,
# driven by core_map.toml). Use ONLY for an intentional facade-vs-core
# difference, e.g. a "0 = use library default" sentinel the facade exposes that
# the core struct spells as its concrete value. Seed empty: every mapped numeric
# / boolean default currently matches its core struct initializer.
#
# Held empty by the audit (allowlist.RATCHETED_SECTIONS), because the sentinel
# case above is rarer than the case an entry here would hide: a facade that
# computes a different value. The first genuine entry takes this section off
# that tuple in the same change.
# ---------------------------------------------------------------------------
[core_default]
params = []

# ---------------------------------------------------------------------------
# [enum] — "key.param" entries whose enum value-sets may differ across surfaces.
# TS unions often carry extra alias spellings (e.g. 'stereo-pan' + 'stereoPan')
# that the C enum lacks; a reviewed alias belongs here.
#
# Held empty by the audit (allowlist.RATCHETED_SECTIONS): an entry is far more
# often a surface that accepts a value the others reject than it is an alias,
# and the two are indistinguishable to the checker. Adding the first alias takes
# this section off that tuple in the same change.
# ---------------------------------------------------------------------------
[enum]
params = []

# ---------------------------------------------------------------------------
# [input_naming] — canonical keys whose audio-input params (samples/sr/...) are
# allowed to be named differently across surfaces. Seed empty: input naming is
# real signal worth triaging.
# ---------------------------------------------------------------------------
[input_naming]
keys = []

# ---------------------------------------------------------------------------
# [wasm_internal] — WASM embind / SonareModule / index.ts names whose
# intra-binding wiring inconsistency is intentional. This suppresses the ACTIVE
# legs (a free embind registration not in the SonareModule type, or an index.ts
# `module.X` call not in the type). The INFORMATIONAL "typed but no facade
# wrapper" leg is already non-gating, so the current cases (detectKey /
# detectKeyCandidates superseded by `_detectKeyWithOptions` / `_detectKeyCandidates`,
# and the unwrapped `mixerPresetJson`) need no entry here. Seed empty: a missing
# type declaration is a real TS break worth surfacing.
# ---------------------------------------------------------------------------
[wasm_internal]
names = []

# ---------------------------------------------------------------------------
# [tuning] — central knobs. Leave empty to use the built-in defaults in
# compare.py. Set these only to override.
#   input_roles:     leading audio-input param names stripped before the
#                    config-order comparison (and compared by the input check).
#   handle_prefixes: C name prefixes treated as handle/class APIs (coverage of
#                    these is informational; matched against facade class methods).
# ---------------------------------------------------------------------------
[tuning]
# input_roles = ["samples", "sample_rate", "sr", "left", "right", "mono", "audio", "x", "y", "buffer", "data", "length"]
# handle_prefixes = ["audio", "eq", "mixer", "engine", "strip", "stream", "streaming", "realtime", "voice", "free", "master"]

# ---------------------------------------------------------------------------
# [record] — RECORD-SHAPE unit (the second extraction unit). Intentional,
# reviewed divergences between a facade's declared record and the C struct that
# is its oracle. Three entry kinds, narrowest first: `fields` (one field),
# `extra_fields` (a richer facade read model; MISSING C fields still report),
# `records` (whole record — blunt, suppresses missing fields too).
#
# A record that merely SHARES A NAME with an unrelated C struct does NOT belong
# here: that is a matching fact, and it lives in `_NOT_A_C_MIRROR` in compare.py.
# ---------------------------------------------------------------------------
[record]
# Category 1 (ergonomic rename or fold) and category 2 (array-length derivation).
# Every entry below was read against both the C header and the facade source.
fields = [
  # --- seconds alternatives to the sample fields ---
  # Node and WASM spell a region's time bounds in samples or in seconds; the
  # binding converts seconds to samples at the call's rate, so the C struct keeps
  # samples only.
  "spectral_region_op.start_sec",
  "spectral_region_op.end_sec",

  # --- the `auto` flag folded into `tuning` ---
  # The C option structs carry a `tuning_auto` flag beside the float `tuning`;
  # Node and WASM spell it `tuning: 'auto'` on the one field.
  "chord_detection_options.tuning_auto",
  "music_analyze_options.tuning_auto",

  # --- ABI plumbing omitted by the TypeScript read models ---
  # schema_version is used by the C/Python layout mirrors and struct seeders;
  # Node/WASM expose the decoded values and do not surface this wire tag.
  "project_vocal_edit_apply_result.schema_version",
  "project_vocal_edit_dependency.schema_version",
  "project_vocal_original_source.schema_version",
  "project_vocal_rehydrate_item.schema_version",
  "vocal_analysis.schema_version",
  "vocal_capabilities.schema_version",
  "vocal_create_options.schema_version",
  "vocal_edit_result.schema_version",
  "vocal_error_detail.schema_version",
  "vocal_note.schema_version",
  "vocal_note_edit.schema_version",
  "vocal_notes_result.schema_version",
  "vocal_render_result.schema_version",
  "vocal_state_bytes.schema_version",
  "vocal_transition.schema_version",

  # --- Vocal read-model folds ---
  # VocalAnalysis wraps the C analysis payload with source/hash provenance
  # returned by the result envelope.
  "vocal_analysis.source_length_samples",
  "vocal_analysis.sample_rate",
  "vocal_analysis.source_sha256",
  "vocal_analysis.analysis_sha256",

  # The JS create request groups the four history/cache limits into one
  # optional `limits` object; the C ABI keeps those scalar fields flat.
  "vocal_create_options.max_history_bytes",
  "vocal_create_options.max_cache_bytes",
  "vocal_create_options.max_undo_depth",
  "vocal_create_options.max_render_jobs",
  "vocal_create_options.limits",

  # Pitch and formant are nested value objects in Node/WASM but are flat C ABI
  # fields. Keep the fold field-scoped so unrelated metadata still gates.
  "vocal_note_edit.target_mode",
  "vocal_note_edit.target_midi",
  "vocal_note_edit.target_points",
  "vocal_note_edit.amount",
  "vocal_note_edit.speed_ms",
  "vocal_note_edit.max_correction_semitones",
  "vocal_note_edit.transpose_semitones",
  "vocal_note_edit.drift_scale",
  "vocal_note_edit.vibrato_scale",
  "vocal_note_edit.formant_mode",
  "vocal_note_edit.formant_shift_semitones",
  "vocal_note_edit.pitch",
  "vocal_note_edit.formant",

  # Split operations return the two new ids as a JS/Python sequence while C
  # carries fixed first/second slots for the ABI result.
  "vocal_id_change.first_new_id",
  "vocal_id_change.second_new_id",
  "vocal_id_change.new_ids",

  # --- category 2 + 1: parallel C arrays folded into one array-of-struct ---
  # C carries `stage_gain_reduction_stages` (char**) and
  # `stage_gain_reduction_values` (float*) plus their shared count; both JS
  # facades expose the zipped `stageGainReductions: StageGainReduction[]`.
  "mastering_chain_result.stage_gain_reduction_stages",
  "mastering_chain_result.stage_gain_reduction_values",
  "mastering_chain_result.stage_gain_reductions",
  "mastering_chain_stereo_result.stage_gain_reduction_stages",
  "mastering_chain_stereo_result.stage_gain_reduction_values",
  "mastering_chain_stereo_result.stage_gain_reductions",

  # --- category 2 + 1: interleaved buffer + counts -> planar channels ---
  # C takes `audio_interleaved` (const float*) with `audio_frames`,
  # `audio_channels` and `audio_sample_rate`; both JS facades pass
  # `channels: Float32Array[]` with `sampleRate` and derive the frame and channel
  # counts from the arrays.
  "project_clip_desc.audio_interleaved",
  "project_clip_desc.audio_frames",
  "project_clip_desc.audio_channels",
  "project_clip_desc.audio_sample_rate",
  "project_clip_desc.channels",
  "project_clip_desc.sample_rate",
  "project_loop_recording_desc.audio_interleaved",
  "project_loop_recording_desc.audio_frames",
  "project_loop_recording_desc.audio",

  # --- category 1: flag word -> string option ---
  # C `flags` (SONARE_PROJECT_LOOP_RECORDING_DROP_PARTIAL_TAIL) is spelled
  # `partialTail: 'keep' | 'drop'` on both JS facades.
  "project_loop_recording_desc.flags",
  "project_loop_recording_desc.partial_tail",

  # --- category 1: ordinal -> string union ---
  # C `kind` (SonareProjectTempoCandidateKind ordinal) is spelled `label`
  # ('primary' | 'half' | 'double').
  "project_tempo_candidate.kind",
  "project_tempo_candidate.label",

  # --- category 1: a C function argument folded into the facade config bag ---
  # The C ABI passes the GM-program follow flag as a separate argument to the
  # synth bounce entry point; every facade folds it into the patch object.
  "synth_patch.use_gm_programs",
  # Same fold, same struct: the sample bank is a field of the C binding rather
  # than of the C patch, and the facades carry it on the patch object.
  "synth_patch.sample_bank",

  # --- category 1: a C call argument folded into the facade's request object ---
  # sonare_sample_bank_add_zone takes the keymap set as its own argument; the
  # facades put it in the zone request bag next to the rest of the rectangle.
  "sample_zone_desc.set_index",

  # --- category 1: two C accessors merged into one facade read model ---
  # The facade's source descriptor also carries the owning audio metadata, which
  # the C ABI serves from sonare_project_get_audio_source_metadata (already
  # credited to `source_by_index` in compare._ALIAS_COVERAGE).
  "project_source.content_hash",
  "project_source.external_stem_role",
  # The stereo room morph's diagnostics travel on the C diagnostic channel
  # (sonare_last_diagnostic_*), as the mono morph's do; the facades fold them
  # into the result.
  "room_morph_stereo_result.diagnostics",

  # --- category 4: intentionally one-sided facade additions ---
  # Human-readable text derived from the diagnostic `code`; the C POD carries
  # the ordinal only.
  "project_diagnostic.message",
  # Literal discriminator for the one transition curve the v1 C ABI implements;
  # the C struct has no field because there is nothing to select.
  "vocal_transition.curve",

  # --- category 1: canonical name strings beside a C enum ordinal ---
  # Both JS facades add the core's canonical spelling next to the ordinal, and
  # say so in-file ("Canonical core spelling; stable across all language
  # bindings").
  "key.name",
  "key.short_name",
  "section.name",
  "chord.name",
  "chord.root_name",
  "chord.bass_name",
  # The duration is endSec - startSec, derived in the facade as Python's
  # Chord.duration_sec property derives it (category 4).
  "chord.duration_sec",

  # --- category 1: a shared buffer + per-record offset -> one array per record ---
  # C returns every note's RMS curve concatenated into one `amplitude` array on
  # SonareNoteObjectsResult, so each note carries `amplitude_offset` to find its
  # slice. Both JS facades cut the slice in the wrapper and hand each note its
  # own `amplitude` typed array, which leaves the offset with nothing to index —
  # it is a C memory-layout detail, not a property of a note. The ctypes mirror
  # keeps the C shape, so Python is not affected.
  "note_object.amplitude_offset",
  "note_object.amplitude",

  # --- category 1: the same fold, on the edit a caller writes ---
  # An amplitude envelope travels the same way: `SonareNoteEdit` names a slice of
  # a pool shared by the note set, so it carries `envelope_offset` and
  # `envelope_count`. The pool exists because the C field has to mean the same
  # thing in both directions — a caller owns the array it passes to
  # sonare_render_notes, the library owns the one sonare_split_note returns, and
  # a bare pointer would give one field two ownership rules. Neither JS facade
  # has that problem, so both hand each edit its own `amplitudeEnvelope` and the
  # offset has nothing left to index. The ctypes mirror keeps the C shape, so
  # Python is not affected.
  "note_edit.envelope_offset",
  "note_edit.envelope_count",
  "note_edit.amplitude_envelope",
  # --- Derived display names (category 4) ---
  # The chord symbol is spelled from root and quality by the core naming
  # function every surface shares; C keeps the numeric fields only.
  "stream_chord_change.name",
  "stream_bar_chord.name",
  # --- Planar audio in place of an interleaved buffer (categories 1 and 2) ---
  # Node and WASM return a bounce as one Float32Array per channel: the
  # interleaved pointer becomes `channels` and the frame count is their length.
  "engine_bounce_result.interleaved",
  "engine_bounce_result.frames",
  "engine_bounce_result.channels",
  # --- Same quantity, another representation (category 1) ---
  # Telemetry reports graph latency in fractional samples; C carries it as
  # Q8 fixed point. Expires when the two units meet.
  "engine_telemetry.graph_latency_samples_q8",
  "engine_telemetry.graph_latency_samples",
  # --- Fields a facade deliberately leaves out (category 4) ---
  # A bounce renders at the project's own rate, the only rate C accepts, so the
  # facades have no sample rate to pass.
  "project_bounce_options.sample_rate",
  # A compile result carries the structured diagnostics only. The message text
  # is those diagnostics joined, and the timeline is compileTimeline()'s.
  "project_compile_result.messages",
  "project_compile_result.has_timeline",
  # A project stores musical positions only. The sample start is derived when
  # the project compiles and is never read back.
  "project_tempo_segment.start_sample",
  # --- Matrix dims folded into Matrix2D rows/cols (category 2) ---
  # C carries a flat buffer plus its counts; both JS facades return a Matrix2D
  # whose rows and cols are those counts.
  "stft_result.n_bins",
  "stft_result.n_frames",
  "cqt_result.n_bins",
  "cqt_result.n_frames",
  "chroma_result.n_chroma",
  "chroma_result.n_frames",
  "mfcc_result.n_mfcc",
  "mfcc_result.n_frames",
  "reassigned_spectrogram_result.n_bins",
  "reassigned_spectrogram_result.n_frames",
  # --- Frame count carried by the per-frame array (category 2) ---
  # Both JS facades return the per-frame curve itself; its length is the count.
  "boundary_result.n_frames",
  "pitch_result.n_frames",
  # --- Stream frame dims and presence word (categories 2 and 1) ---
  # mel and chroma are Matrix2D whose rows are n_mels / n_chroma, and each
  # feature array is absent when not computed, which says what feature_flags says.
  "stream_frames.n_mels",
  "stream_frames.n_chroma",
  "stream_frames.feature_flags",
  "stream_frames_u8.n_mels",
  "stream_frames_u8.n_chroma",
  "stream_frames_u8.feature_flags",
  "stream_frames_i16.n_mels",
  "stream_frames_i16.n_chroma",
  "stream_frames_i16.feature_flags",
  # --- Progressive estimate nested under `estimate` (category 1) ---
  # Both JS facades group these under estimate: StreamProgressiveEstimate while
  # C keeps them flat; field-scoped so a new missing counter still gates.
  "stream_stats.bpm",
  "stream_stats.bpm_confidence",
  "stream_stats.key",
  "stream_stats.key_minor",
  "stream_stats.key_confidence",
  "stream_stats.chord_root",
  "stream_stats.chord_quality",
  "stream_stats.chord_confidence",
  "stream_stats.chord_start_sec",
  "stream_stats.current_bar",
  "stream_stats.bar_duration_sec",
  "stream_stats.chord_progression",
  "stream_stats.bar_chord_progression",
  "stream_stats.voted_pattern",
  "stream_stats.detected_pattern_name",
  "stream_stats.detected_pattern_score",
  "stream_stats.all_pattern_scores",
  "stream_stats.accumulated_sec",
  "stream_stats.used_frames",
  "stream_stats.updated",
  "stream_stats.estimate",
  # --- Beat times folded into beats (categories 2 and 1) ---
  # C beat_times + beat_count become beats: Beat[], each beat carrying its time
  # and the count being the array length.
  "analysis_result.beat_times",
  # --- Reserved surround pan fields (category 4) ---
  # The C struct still carries elevation and distance, documented as having no
  # effect; the facades do not expose them and pass their fixed 0 / 1.
  "surround_pan.elevation",
  "surround_pan.distance",
]

# Category 4 (intentionally one-sided): the facade record is a RICHER read model
# than the C struct, so extra fields are expected while a MISSING C field still
# reports. `SonareAnalysisResult` is the lean POD returned by the struct-based C
# entry points; the TS `AnalysisResult` mirrors the parsed sonare_analyze_json
# document (nested beats / chords / sections / timbre / dynamics / rhythm /
# melody / form). Stated as a direction rather than as a field list so the entry
# stays correct as the analysis document grows.
[record.extra_fields]
node = ["analysis_result"]
wasm = ["analysis_result"]

# Whole-record suppression. Empty on purpose: it hides missing C fields too,
# which is the drift this unit exists to catch. Reach for `extra_fields` or
# `fields` instead.
[record.records]
