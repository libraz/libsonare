  "synth_patch_round_trip_for_test", # WASM-only regression hook for embind patch shape
  "bind_web_midi",                   # Browser Web MIDI listener glue; routes to existing realtime-engine MIDI input APIs
  "is_web_midi_available",           # Browser capability probe for Web MIDI; platform-only facade helper
  "web_midi_event_context_time",     # Browser Web MIDI timestamp -> AudioContext time conversion; platform-only facade helper
  "bind_microphone_input",           # Browser getUserMedia -> AudioWorkletNode glue; platform-only realtime input helper
  "create_opfs_clip_page_provider",  # Browser OPFS Worker -> paged clip provider glue; platform-only long-clip helper
  "create_opfs_clip_page_worker",    # Browser OPFS Worker constructor for paged clip supply; platform-only helper
  "attach_opfs_clip_stream",         # One-call OPFS streaming-clip wiring over create_opfs_clip_page_provider; platform-only helper
  "write_opfs_clip",                 # Browser OPFS writer for the raw clip layout the paged readers consume; platform-only helper
  "import_opfs_clip",                # Decodes audio and writes it with write_opfs_clip; platform-only helper
  "decode_channels_with_browser_fallback",  # decode_channels with the browser decodeAudioData fallback; platform-only helper
]

