# ---------------------------------------------------------------------------
# [order] — keys whose facade param order legitimately differs from the C ABI
# beyond the options-bag-prefix convention. Seed empty.
# ---------------------------------------------------------------------------
[order]
# A JS facade that takes a request object declares no parameter order at all, so
# the comparison is not made and the report says so per (key, surface). Those
# need no entry here, which is why most of the keys below are listed for python
# alone: the same fold that removes the divergence removes the comparison, and it
# comes back on its own if a facade returns to positional parameters.
#
# What the JS facades do with those folded arguments does not follow from any
# signature, so it is recorded here rather than left to an entry that suppresses
# nothing:
#   preemphasis / deemphasis  C is (coef, zi, use_zi); Node and WASM expose
#     (coef, zi?) and DERIVE use_zi from whether zi was supplied.
#   tempogram                 Node and WASM REPLACE the C center / norm flags
#     with the `mode` selector; Python keeps center + norm and adds `mode`.
#   pitch_correct_timevarying / spectral_edit  the JS request fields are a
#     PitchCorrectOptions bag and nFft / hopLength / window / healRadiusFrames.
#   analyze_melody            WASM passes the extended use_pyin / center params
#     through an options object rather than appending them positionally.
#   Across this whole group, every facade — not only the one listed below —
#   derives the C count / extent arguments from array length and remaps to the C
#   order inside its own wrapper (addon / embind / ctypes).
#
# scale_quantize_midi / scale_correction_semitones: C orders the optional
# reference pitch BEFORE the value being quantized (root, mode_mask,
# reference_midi, midi). All facades use the ergonomic order (root, mode_mask,
# midi, reference_midi=default) and remap to C order internally (verified in the
# addon / embind / ctypes wrappers).
#
# chord_functional_analysis (python): C is (options-bag, key_root, key_mode); the
# facade puts (key_root, key_mode) first and INLINES the
# SonareChordDetectionOptions fields after them — the same ergonomic
# options-inlining + key-first shape already used for detect_chords. Remapped
# internally; not order drift.
# midi_cc_learn (python): C is (events, count, param_id, min_value, max_value,
# min_movement). The facade DERIVES `count` from the events array length and keeps
# the range params as keyword args. Passing both the array and a redundant count
# would let them disagree. Remapped to C order internally; ergonomic convenience,
# not order drift. Node and WASM carry no entry: their request object declares no
# order.
# midi_route_events (python): C is (events, count, config). The facade exposes
# (events, config) and DERIVES `count` from the events array length. Node and WASM carry no entry: their
# trailing options bag is structural, so what reaches the comparison is a strict
# prefix of the C order and there is nothing left to excuse. (The facade method is
# `midiRouteEvents` / `route_midi_events`, mapped to this C key.)
# split_note / merge_notes (python): C is (samples, length, sample_rate, f0_hz,
# voiced_prob, voiced, n_frames, frame_rate, ...). The facade DERIVES n_frames from
# the f0_hz array length and folds the SonareNoteExtractorConfig fields and the
# voiced / voiced_prob companions into keyword args. It also drops `envelopes`: the
# C signature passes one pooled array because SonareNoteEdit indexes it by offset,
# while the facade hands each note its own envelope, so there is no pool for the
# argument to name. Same fold recorded for note_edit under [record].
# split_silence_common (python): C is (signals, signal_count, lengths, top_db,
# frame_length, hop_length). The facade takes one sequence of sequences and
# DERIVES both the count and the per-signal `lengths` array from it — a Python
# caller holding a list of takes has no second place to state their lengths, and
# passing one alongside would let the two disagree. Same array-length derivation
# as midi_route_events, on a ragged input. Node and WASM carry no entry: their
# request object declares no order, so nothing reaches the comparison.
#
# downmix (all facades): C is (channels, frames, channel_count, target_layout) over one
# packed planar block. Every facade takes (channels, target_layout) with one array
# per channel and DERIVES frames and channel_count from them.
node = [
  "scale_quantize_midi",
  "scale_correction_semitones",
  "downmix",
  "chord_symbol_from_analysis", # the facade folds root/quality/bass into one analysis chord object and sizes the extensions array itself
]
