<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>libsonare browser MIDI render</title>
  <button id="render" type="button">Render MIDI phrase and download WAV</button>
  <pre id="result">Render a two-note NativeSynth phrase.</pre>
  <script type="module">
    import { Project, init, midiNoteOff, midiNoteOn } from '../../bindings/wasm/dist/index.js';
    import { downloadPcm16Wav } from './wav-download.js';

    await init();
    const render = document.querySelector('#render');
    const result = document.querySelector('#result');
    render.addEventListener('click', () => {
      render.disabled = true;
      try {
        const project = new Project();
        try {
          project.setSampleRate(48000);
          const { clipId } = project.addMidiClip(0, 4);
          project.setMidiEvents(clipId, [
            midiNoteOn({ ppq: 0, group: 0, channel: 0, note: 60, velocity: 100 }),
            midiNoteOff({ ppq: 1, group: 0, channel: 0, note: 60 }),
            midiNoteOn({ ppq: 1, group: 0, channel: 0, note: 64, velocity: 100 }),
            midiNoteOff({ ppq: 2, group: 0, channel: 0, note: 64 }),
          ]);
          const { channels, sampleRate } = project.bounce({ numChannels: 2, synthInstruments: [{ instrument: { preset: 'sawLead' } }] });
          const samples = new Float32Array(channels[0].length * 2);
          channels[0].forEach((left, i) => {
            samples[2 * i] = left;
            samples[2 * i + 1] = channels[1][i];
          });
          downloadPcm16Wav('midi-phrase.wav', samples, sampleRate, channels.length);
          result.textContent = 'Downloaded midi-phrase.wav';
        } finally {
          project.destroy();
        }
      } catch (error) {
        result.textContent = error instanceof Error ? error.message : String(error);
      } finally {
        render.disabled = false;
      }
    });
  </script>
</html>
